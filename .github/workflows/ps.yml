name: ps
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ps
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/ps.mjs out/ps.json
      - name: veri-ps dalına yaz (site yeniden build olmaz)
        run: |
          [ -f out/ps.json ] || { echo "ps.json üretilmedi, dal güncellenmedi"; exit 0; }
          cd out
          git init -q -b veri-ps
          git config user.name "ps-bot"
          git config user.email "ps-bot@users.noreply.github.com"
          git add ps.json
          git commit -q -m "ps $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri-ps
