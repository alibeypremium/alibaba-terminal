name: pages
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.d.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: önbellek sürümünü damgala (js/css adreslerine içerik özeti eklenir; eski önbellekle yeni dosya karışmaz)
        run: |
          V=$(cat public/js/*.js public/css/*.css | sha1sum | cut -c1-10)
          sed -i "s/__V__/$V/g" public/index.html
          grep -c "?v=$V" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: canlı siteyi aç ve kontrol et
        run: node tests/smoke-live.mjs "${{ needs.deploy.outputs.url }}"
