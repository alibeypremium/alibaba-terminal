name: test
on:
  push:
    branches: [main]
    paths: ['public/**', 'tests/**', '.github/scripts/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: npm test
