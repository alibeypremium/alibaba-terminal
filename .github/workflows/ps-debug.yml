name: ps-debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: incele
        run: |
          cat > d.mjs <<'EOF'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const h='9845afc0dbaab4965f6563fffc703f588c8e76792000e8610843b8d3ee9c4c09';
          const q=async(cat,vars2)=>{
            const vars={id:cat,pageArgs:{size:24,offset:0},sortBy:null,filterBy:[],facetOptions:[],...vars2};
            const u='https://web.np.playstation.com/api/graphql/v1/op?operationName=categoryGridRetrieve&variables='+encodeURIComponent(JSON.stringify(vars))+'&extensions='+encodeURIComponent(JSON.stringify({persistedQuery:{version:1,sha256Hash:h}}));
            const r=await fetch(u,{headers:{'user-agent':UA,'accept':'application/json','content-type':'application/json','x-psn-store-locale-override':'tr-TR','origin':'https://store.playstation.com','referer':'https://store.playstation.com/','accept-language':'tr-TR,tr;q=0.9'}});
            return {s:r.status,j:await r.json().catch(()=>null)};
          };
          const cat='3f772501-f6f8-49b7-abac-874a88ca4897';
          const {s,j}=await q(cat,{pageArgs:{size:100,offset:0},sortBy:{name:'sales30',isAscending:false}});
          const g=j&&j.data&&j.data.categoryGridRetrieve;
          console.log('status',s,'n',(g.products||[]).length,'sorts',(g.sortingOptions||[]).map(o=>o.name+(o.isAscending?'+':'-')).join(','));
          const p=g.products[0];const {media,...rest}=p;console.log('P0',JSON.stringify(rest).slice(0,900));console.log('MEDIA roles',[...new Set(media.map(m=>m.role+'/'+m.type))].join(' '));
          console.log('class',[...new Set(g.products.map(x=>x.storeDisplayClassification||x.localizedStoreDisplayClassification))].join(','));
          console.log('top10',g.products.slice(0,10).map(x=>x.name+' '+(x.price&&x.price.discountText)+' '+(x.price&&x.price.basePrice)).join(' || '));
          const t=await q(cat,{pageArgs:{size:24,offset:0},sortBy:{name:'discountPercentage',isAscending:false}});console.log('sort disc',t.s,String(JSON.stringify(t.j&&t.j.errors||'')).slice(0,200),(t.j&&t.j.data&&t.j.data.categoryGridRetrieve.products||[]).map(x=>x.price&&x.price.discountText).join(','));
          EOF
          node d.mjs
