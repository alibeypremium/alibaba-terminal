name: ps-debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: incele
        run: |
          cat > d.mjs <<'EOF'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const h='9845afc0dbaab4965f6563fffc703f588c8e76792000e8610843b8d3ee9c4c09';
          const q=async(cat,v2)=>{
            const vars={id:cat,pageArgs:{size:5,offset:0},sortBy:null,filterBy:[],facetOptions:[],...v2};
            const u='https://web.np.playstation.com/api/graphql/v1/op?operationName=categoryGridRetrieve&variables='+encodeURIComponent(JSON.stringify(vars))+'&extensions='+encodeURIComponent(JSON.stringify({persistedQuery:{version:1,sha256Hash:h}}));
            const r=await fetch(u,{headers:{'user-agent':UA,accept:'application/json','content-type':'application/json','x-psn-store-locale-override':'tr-TR',origin:'https://store.playstation.com',referer:'https://store.playstation.com/','accept-language':'tr-TR,tr;q=0.9'}});
            const j=await r.json().catch(()=>null);return {s:r.status,g:j&&j.data&&j.data.categoryGridRetrieve,e:j&&j.errors};
          };
          const sh=(x)=>String(JSON.stringify(x)).slice(0,900);
          const ps5='4cbf39e2-5749-4970-ba81-93a489e4570c';
          for(const fb of [['productReleaseDate:next_thirty_days'],['productReleaseDate:future_release_date'],['productReleaseDate:last_thirty_days'],[{name:'productReleaseDate',value:'next_thirty_days'}]]){
            try{const {s,g,e}=await q(ps5,{filterBy:fb,facetOptions:[],sortBy:{name:'productReleaseDate',isAscending:true}});
            console.log('FB',sh(fb),s,g?('total '+(g.pageInfo&&g.pageInfo.totalCount)+' '+(g.products||[]).map(p=>p.name).join(' ; ')):sh(e));
            if(g&&g.products&&g.products[0]&&fb[0]==='productReleaseDate:next_thirty_days'){const {media,...rest}=g.products[0];console.log('P0',sh(rest))}}catch(e){console.log('FB hata',e.message)}
          }
          const {g:gg}=await q(ps5,{pageArgs:{size:3,offset:0},filterBy:['productReleaseDate:future_release_date']});
          if(gg)console.log('FUT',sh((gg.products||[]).map(p=>({n:p.name,price:p.price,keys:Object.keys(p).join(',')}))));
          const {g:g3}=await q(ps5,{filterBy:['productGenres:ACTION','targetPlatforms:PS5'],sortBy:{name:'sales30',isAscending:false}});
          console.log('MULTI',g3?('total '+g3.pageInfo.totalCount+' '+g3.products.map(p=>p.name).join(';')):'yok');
          for(const op of ['getSearchResults','searchResults','universalSearch']){console.log('op',op)}
          EOF
          node d.mjs
