name: ps-debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: incele
        run: |
          cat > d.mjs <<'EOF'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const H=['9845afc0dbaab4965f6563fffc703f588c8e76792000e8610843b8d3ee9c4c09'];
          const cat='3f772501-f6f8-49b7-abac-874a88ca4897';
          for(const h of H){
            const vars={id:cat,pageArgs:{size:24,offset:0},sortBy:null,filterBy:[],facetOptions:[]};
            const ext={persistedQuery:{version:1,sha256Hash:h}};
            const u='https://web.np.playstation.com/api/graphql/v1/op?operationName=categoryGridRetrieve&variables='+encodeURIComponent(JSON.stringify(vars))+'&extensions='+encodeURIComponent(JSON.stringify(ext));
            const r=await fetch(u,{headers:{'user-agent':UA,'accept':'application/json','content-type':'application/json','x-psn-store-locale-override':'tr-TR','origin':'https://store.playstation.com','referer':'https://store.playstation.com/','accept-language':'tr-TR,tr;q=0.9'}});
            const t=await r.text();console.log('API',r.status,t.length,t.slice(0,1500).replace(/\s+/g,' '));
          }
          const r2=await fetch('https://store.playstation.com/tr-tr/pages/deals',{headers:{'user-agent':UA,'accept-language':'tr-TR,tr;q=0.9'}});
          const t2=await r2.text();const ids=[...new Set([...t2.matchAll(/\/category\/([0-9a-f-]{36})/g)].map(x=>x[1]))];console.log('deals kategori',ids.length,ids.slice(0,12).join(' '));
          const bt=t2.match(/"batarangs":\{[\s\S]{0,600}/);console.log('batarangs',bt?bt[0].replace(/\s+/g,' ').slice(0,600):'yok');
          EOF
          node d.mjs
