<canvas id="bg" aria-hidden="true"></canvas>
<div class="shell">
  <div class="sb" id="sb">
    <div class="sb-chips" id="sbChips"></div>
    <div class="tk" id="tk" hidden aria-label="Son haberler"></div>

      <div class="brand-n">AliBaba</div>
      <div class="brand-t">Terminal</div>
    </div>
    <div class="top-r">
      <div class="timeblk">
        <div class="date" id="dateLine"></div>
        <div class="clock" id="clock" aria-live="off"></div>
      </div>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>
<div class="tray" id="tray">

  <span id="trayList" style="display:contents"></span>
