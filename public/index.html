<style>
/* Düzen: iOS "Bugün Görünümü" gibi kare hücreli ızgara; her widget kendi renk dünyasında cam panel; arkada Three.js ile 3D duvar kağıdı. */
:root{
  --bg:#070817; --fg:#fff; --fg2:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.12); --hairline:rgba(255,255,255,.2); --pop:rgb(26,24,52);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --serif:"Newsreader","New York",Georgia,serif;
  --gap:14px; --cell:150px; --radius:30px;
}
:root[data-theme="light"]{
  --bg:#e8ecfa; --fg:#12142b; --fg2:rgba(18,20,43,.6);
  --glass:rgba(255,255,255,.6); --hairline:rgba(18,20,43,.12); --pop:rgb(255,255,255);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{scrollbar-width:none;overscroll-behavior-y:none}
html::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .5s,color .5s}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.shell{position:relative;z-index:1;max-width:2000px;margin:0 auto;
  padding-top:max(20px,env(safe-area-inset-top));padding-bottom:calc(120px + env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* Üst bölüm */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.date{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2);text-align:right}
h1{margin:4px 0 0;font-size:clamp(30px,5.4vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.top-r{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.timeblk{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.brand{display:flex;flex-direction:column;align-items:flex-start;width:max-content;gap:2px}
.brand-n{width:max-content;font-size:clamp(28px,4.4vw,38px);font-weight:700;letter-spacing:-.035em;line-height:.95}
.brand-t{display:block;width:max-content;font-family:'Caveat','Segoe Script','Bradley Hand','Comic Sans MS',cursive;font-size:20px;font-weight:600;letter-spacing:.14em;line-height:1;color:var(--fg2);white-space:nowrap}
.clock{font-size:clamp(38px,8vw,68px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pill{appearance:none;border:1px solid var(--hairline);background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  color:var(--fg);padding:9px 15px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .15s,background .2s}
.pill:hover{transform:translateY(-1px)}
.pill:active{transform:scale(.96)}
.pill:focus-visible,.w button:focus-visible,.w input:focus-visible,.w textarea:focus-visible{outline:2px solid #4da3ff;outline-offset:2px}
.pill.on{background:#0a84ff;border-color:transparent;color:#fff}
.pill svg{width:15px;height:15px}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(340px,calc(100vw - 32px));padding:14px;border-radius:22px;z-index:30;
  background:var(--glass);border:1px solid var(--hairline);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.pop[hidden]{display:none}
.pop label{font-size:12px;font-weight:600;color:var(--fg2);letter-spacing:.05em;text-transform:uppercase}
.pop .row{display:flex;gap:8px}
.pop input{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--hairline);background:rgba(127,127,140,.14);font-size:15px}
.pop .msg{font-size:12.5px;color:var(--fg2);min-height:1.2em}

/* Durum çubuğu */
.sb{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:5px 8px 5px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--hairline);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);font-size:12.5px;min-height:40px}
.sb-live{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:10.5px;flex:none;padding-right:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158;flex:none;animation:pulse 1.8s infinite}
.dot.warn{background:#ffb020;animation:none}.dot.err{background:#ff453a;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.sb-chips{display:flex;gap:6px;overflow-x:auto;flex:0 1 auto;min-width:0;scrollbar-width:none;align-items:center}
.sb-chips::-webkit-scrollbar{display:none}
.sb-r{display:flex;gap:6px;flex:none;align-items:center}
.sb-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;background:rgba(127,127,140,.16);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.sb-chip .dot{width:7px;height:7px;animation:none;margin:0 1px 0 3px}
.sb-chip b{font-weight:700;font-size:11.5px}
.sb-v{font-weight:600}
.sb-chip i{font-style:normal;font-size:11px;font-weight:700}
.sb-chip i.up{color:#1fb35b}.sb-chip i.dn{color:#ef4444}
.sb-ic{width:18px;height:18px;border-radius:50%;overflow:hidden;display:inline-block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.sb-ic svg{width:100%;height:100%;display:block}
.sb-ic.wx{overflow:visible;box-shadow:none;width:22px;height:22px}
.sb{position:relative;z-index:40}
.sb .pop{right:8px;top:calc(100% + 8px);background:var(--pop)}
.pop-cur{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--hairline)}
.pop-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.pop-cur b{font-size:18px;letter-spacing:-.01em}
#popCoord{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.sb-btn{appearance:none;border:0;color:inherit;font:inherit;cursor:pointer;transition:background .2s}
.sb-btn:hover{background:rgba(127,127,140,.32)}
.sb-btn:focus-visible{outline:2px solid #4da3ff;outline-offset:1px}
.sb-pin svg{width:15px;height:15px;display:block}
.sb-pin{display:inline-grid;place-items:center;width:18px;height:18px}
.sb-chev{width:10px;height:10px;opacity:.6}
.sb-bolt{width:15px;height:15px;flex:none;color:#30d158;filter:drop-shadow(0 0 4px currentColor)}
.sb-bolt.warn{color:#ffb020}.sb-bolt.err{color:#ff453a}
.sb-ms{position:relative;cursor:default;outline:none}
.sb-tip{position:absolute;right:0;top:100%;padding-top:10px;display:none;z-index:60;cursor:default}
.sb-ms:hover .sb-tip,.sb-ms:focus .sb-tip,.sb-ms:focus-within .sb-tip{display:block}
.sb-tip>div{min-width:210px;padding:10px 12px;border-radius:14px;background:rgba(24,26,36,.96);color:#e9ecf5;border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 34px -10px rgba(0,0,0,.6);font-size:11.5px;font-weight:500;line-height:1.55;white-space:pre;text-align:left;letter-spacing:0}
:root[data-theme="light"] .sb-tip>div{background:rgba(255,255,255,.97);color:#1c1f2a;border-color:rgba(0,0,0,.1)}
.sb-ms.off .sb-bolt{color:#8e8e93;filter:none}   /* akış kopuk: gri; canlıyken renk ms değerine göre */
.sb-moon{display:inline-grid;place-items:center;width:15px;height:15px;flex:none}
.sb-moon svg{width:100%;height:100%;display:block}

.sb-sep{width:1px;height:20px;background:var(--hairline);flex:none;margin:0 6px}
.sb-wait{color:var(--fg2);font-size:12px;padding-left:4px}
@media (max-width:760px){
  .sb{flex-wrap:wrap;border-radius:22px;padding-bottom:6px}
  .sb-chips{flex:1 1 0}
  .tk{order:5;flex:1 0 100%;margin:0;border-left:0;border-top:1px solid var(--hairline);border-radius:0;height:28px}}


/* Kayan haber şeridi (Teknoloji · Oyun · Otomobil karışık) */
.tk{position:relative;overflow:hidden;height:26px;flex:1 1 0;min-width:0;margin:0 4px;display:flex;align-items:center;font-size:12.5px;
  border-left:1px solid var(--hairline);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tk[hidden]{display:none}
/* Geniş ekranda şerit, YouTube widget'ıyla aynı genişlik ve hizada durur (konumu JS hesaplar); kur/kripto çipleri solda kalan yere ölçeklenir. */
.sb.al .tk{position:absolute;top:50%;translate:0 -50%;flex:none;margin:0;border-right:1px solid var(--hairline)}
.sb.al .sb-chips{overflow:hidden}
.sb.al .sb-r{margin-left:auto}
.tk-track{display:flex;flex:none;width:max-content;animation:tkm var(--dur,120s) linear infinite;will-change:transform}
.tk:hover .tk-track,.tk:has(a:focus-visible) .tk-track,.editing .tk-track{animation-play-state:paused}
.tk-grp{display:flex;align-items:center;flex:none}
.tk-i{display:inline-flex;align-items:center;gap:8px;padding:0 20px;white-space:nowrap;text-decoration:none;color:var(--fg);font-weight:500}
.tk-i:hover span:last-child{text-decoration:underline}
.tk-tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;color:#fff;flex:none}
.tk-src{color:var(--fg2);font-size:11px;font-weight:500}
@keyframes tkm{to{transform:translateX(-50%)}}
/* Sade modda da haber şeridi kayar (yalnızca hareketi azalt ayarı durdurur) */
@media (prefers-reduced-motion:reduce){.tk-track{animation:none}.tk{overflow-x:auto;scrollbar-width:none}.tk-grp+.tk-grp{display:none}}

/* Sığdırma modu (geniş ekran): tüm widget'lar tek sayfada */
body.fit .top{margin-bottom:10px}
body.fit .brand-n{font-size:26px}
body.fit .brand{gap:5px}
body.fit .timeblk{gap:1px}
body.fit .date{font-size:11px}
body.fit .top-r{flex-direction:row;align-items:center;gap:14px}
body.fit .clock{font-size:36px}
body.fit .sb{margin-bottom:8px}
body.fit .shell{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}

/* Izgara */
.grid{display:grid;grid-template-columns:repeat(var(--cols,8),1fr);grid-auto-rows:var(--cellh,var(--cell));gap:var(--gap);grid-auto-flow:dense}

/* Widget */
.w{--t:#fff;--t2:rgba(255,255,255,.68);--acc:#fff;--line:rgba(255,255,255,.14);
  position:relative;border-radius:var(--radius);overflow:hidden;isolation:isolate;color:var(--t);
  background:var(--w-bg);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.12),0 22px 44px -22px rgba(0,0,0,.6);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.w[hidden]{display:none}
.w::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.24),rgba(255,255,255,0) 38%)}
.w::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:var(--glare,0);transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.28),transparent 60%)}
.w-body{position:absolute;inset:0;container-type:size;z-index:1}
.w-in{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;padding:clamp(12px,5.2cqw,18px)}
.hd{display:flex;align-items:center;gap:8px;flex:none;min-height:26px}
.logo{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.25)}
.logo svg{width:17px;height:17px;display:block}
.ttl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sp{flex:1}
@container (max-width:210px){.ttl{display:none}}
.ibtn{appearance:none;border:0;text-decoration:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--t);cursor:pointer;display:grid;place-items:center;flex:none;transition:background .2s,transform .15s}
.ibtn:hover{background:rgba(255,255,255,.26)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:14px;height:14px}
.foot{font-size:10.5px;color:var(--t2);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}

/* Düzenleme modu */
.w-shield,.w-minus,.w-sizes,.w-resize{display:none}
.editing .w{animation:jig .3s ease-in-out infinite alternate;animation-delay:var(--d,0s);transform:none!important;cursor:grab}
.editing .w.dragging{animation:none;z-index:50;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);scale:1.03;cursor:grabbing;transition:box-shadow .2s,scale .2s}
@keyframes jig{from{rotate:-.5deg}to{rotate:.5deg}}
.editing .w-shield{display:block;position:absolute;inset:0;z-index:5;touch-action:pan-y}
.w-grip{display:none}
.editing .w-grip{display:block;position:absolute;top:4px;left:50%;translate:-50% 0;width:64px;height:26px;z-index:8;cursor:grab;touch-action:none}
.w-grip::after{content:"";position:absolute;left:50%;top:9px;translate:-50% 0;width:34px;height:6px;border-radius:3px;background:rgba(28,28,34,.88);box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.editing .w{user-select:none;-webkit-user-select:none}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.is-dragging .w{backdrop-filter:none;-webkit-backdrop-filter:none}
.editing .w-minus{display:grid;position:absolute;top:10px;left:10px;z-index:7;width:26px;height:26px;border-radius:50%;border:0;background:rgba(30,30,36,.85);color:#fff;font-size:20px;line-height:1;place-items:center;cursor:pointer;padding:0 0 3px}
.editing .w-sizes{display:flex;position:absolute;bottom:10px;left:50%;translate:-50% 0;z-index:7;gap:2px;padding:3px;border-radius:999px;background:rgba(28,28,34,.82);backdrop-filter:blur(12px)}
.w-sizes button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.75);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer}
.w-sizes button.on{background:#fff;color:#111}
.editing .w-resize{display:block;position:absolute;right:4px;bottom:4px;width:38px;height:38px;z-index:8;cursor:nwse-resize;touch-action:none}
.w-resize::after{content:"";position:absolute;right:9px;bottom:9px;width:15px;height:15px;border-right:3px solid #fff;border-bottom:3px solid #fff;border-radius:0 0 9px 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.tray{position:fixed;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px;border-radius:26px;background:rgba(24,24,30,.78);color:#fff;backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);box-shadow:0 20px 50px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12)}
.editing .tray{display:flex}
.tray .lbl{font-size:12px;color:rgba(255,255,255,.6);padding:0 6px;font-weight:600}
.tray button{appearance:none;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.tray button.done{background:#0a84ff}
.tray button:hover{filter:brightness(1.2)}

/* ====== Widget temaları ====== */
/* Hava */
.w[data-id=weather]{--w-bg:linear-gradient(165deg,var(--s1),var(--s2));--s1:rgba(46,128,246,.92);--s2:rgba(118,190,255,.9)}
.w[data-id=weather][data-sky=cloud]{--s1:rgba(84,104,132,.94);--s2:rgba(143,163,184,.92)}
.w[data-id=weather][data-sky=rain]{--s1:rgba(44,60,88,.95);--s2:rgba(84,110,140,.92)}
.w[data-id=weather][data-sky=night]{--s1:rgba(12,20,52,.96);--s2:rgba(44,58,118,.94)}
.w[data-id=weather][data-sky=snow]{--s1:rgba(108,128,154,.94);--s2:rgba(190,205,224,.92)}
.w[data-id=weather][data-sky=storm]{--s1:rgba(30,32,58,.96);--s2:rgba(72,76,120,.94)}
.wx{display:flex;flex-direction:column;height:100%;gap:6px;min-height:0}
.wx-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wx-place{font-weight:650;font-size:15px;display:flex;gap:5px;align-items:center}
.wx-place svg{width:12px;height:12px}
.wx-cond{font-size:12px;color:var(--t2);text-align:right}
.wx-main{display:flex;align-items:center;gap:10px;flex:1;min-height:0}
.wx-icon svg{width:clamp(44px,22cqw,92px);height:auto;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}
.wx-temp{font-size:clamp(44px,23cqw,84px);font-weight:200;line-height:1;letter-spacing:-.05em}
.wx-hilo{font-size:12px;color:var(--t2);line-height:1.5}
.wx-hours,.wx-days{display:none}
.wx-hours{gap:0;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.wx-h{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-variant-numeric:tabular-nums}
.wx-h svg{width:24px;height:24px}
.wx-h b{font-weight:600;font-size:13px}
.wx-h span{color:var(--t2)}
@container (min-width:330px){.wx-hours{display:flex}}
@container (min-width:330px) and (min-height:230px){.wx-main{flex:none}.wx-hilo{margin-top:-4px}}
.wx-days{border-top:1px solid var(--line);padding-top:8px;flex:1;min-height:0;overflow:auto}
@container (min-height:330px){.wx-days{display:block}}
.wx-d{display:grid;grid-template-columns:54px 28px 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.wx-d svg{width:24px;height:24px}
.wx-d .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.wx-d .bar i{position:absolute;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#7fd1ff,#ffd166)}
.wx-d span{color:var(--t2);font-variant-numeric:tabular-nums}

/* Namaz */
.w[data-id=prayer]{--w-bg:radial-gradient(1px 1px at 12% 22%,#fff9,transparent),radial-gradient(1.4px 1.4px at 78% 14%,#fffc,transparent),radial-gradient(1px 1px at 52% 68%,#fff8,transparent),radial-gradient(1.2px 1.2px at 90% 72%,#fff9,transparent),radial-gradient(1px 1px at 30% 86%,#fff7,transparent),linear-gradient(160deg,rgba(54,38,128,.94),rgba(14,14,50,.96));--acc:#ffd57a}
.pr{display:flex;flex-direction:column;height:100%;gap:8px;min-height:0}
.pr-next{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex:1;min-height:0;align-items:center}
.pr-nm{font-size:13px;color:var(--t2)}
.pr-nm b{display:block;font-size:clamp(17px,6cqw,26px);color:var(--t);font-weight:650;letter-spacing:-.01em}
.pr-cd{font-size:clamp(26px,10cqw,46px);font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--acc)}
.pr-times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pt{padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.pt span{font-size:10.5px;color:var(--t2);letter-spacing:.04em}
.pt b{font-size:15px;font-weight:600}
.pt.past{opacity:.5}
.pt.next{background:var(--acc);color:#2a1c52}
.pt.next span{color:rgba(42,28,82,.7)}
@container (min-width:520px){.pr-times{grid-template-columns:repeat(6,1fr)}}
@container (max-width:230px){.pr-times{display:none}}
@container (max-height:150px){.pr-times{display:none}}
.pr-hjw{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0;line-height:1.25;flex:none;max-width:calc(100% - 34px)}
/* Yer daraldığında önce başlık küçülür; tarih ve dini gün satırı yerinde kalır (çok uzunsa "…" ile kısalır). Çok darsa başlık gizlenir. */
.pr .ttl{flex:0 100 auto}
@container (max-width:330px){.pr .ttl{display:none}}
.pr-hj{font-size:11.5px;color:var(--t2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pr-ev{font-size:11px;font-weight:650;color:var(--acc);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pr-ev:empty{display:none}
/* Sıradaki vaktin saati: vakit ızgarası gizlendiğinde (dar ya da kısa widget) etiketin yanında görünür */
.pr-at{display:none;color:var(--acc);font-weight:650;font-variant-numeric:tabular-nums}
@container (max-width:230px){.pr-at{display:inline}}
@container (max-height:175px){.pr-at{display:inline}}

/* YouTube */
.w[data-id=youtube]{--w-bg:linear-gradient(160deg,rgba(32,22,26,.96),rgba(14,14,18,.97));--acc:#ff3030}
.yt{display:flex;flex-direction:column;height:100%;gap:10px;min-height:0}
.yt-in{display:flex;gap:6px;flex:none}
.yt-in input{flex:1;min-width:0;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);font-size:13px;color:#fff}
.yt-in[hidden]{display:none}
.ibtn.sbt:not(.on){opacity:.65}
.yt-in input::placeholder{color:rgba(255,255,255,.45)}
.yt-go{appearance:none;border:0;border-radius:12px;padding:0 14px;background:#ff2d2d;color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex:none}
.yt-go:hover{filter:brightness(1.1)}
.yt-view{flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#000;position:relative;display:grid;place-items:center}
.yt-view iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-empty{text-align:center;padding:10px;color:var(--t2);font-size:12.5px;display:flex;flex-direction:column;gap:8px;align-items:center}
.yt-empty svg{width:56px;height:auto;filter:drop-shadow(0 8px 20px rgba(255,0,0,.4))}
@container (max-width:250px){.yt-in{flex-direction:column}.yt-go{padding:7px}}

/* TradingView */
.w[data-id=tv]{--w-bg:linear-gradient(160deg,rgba(24,30,46,.97),rgba(14,17,28,.98));--acc:#2962ff}
.tv{display:flex;flex-direction:column;height:100%;gap:8px;min-height:0}
.tv-tabs{display:flex;gap:6px;flex:none}
.tv-tab{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:5px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tv-tab.on{background:#2962ff;border-color:transparent}
.tv-tab b{font-size:12px}
.tv-tab span{font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}
.up{color:#3ddc97}.dn{color:#ff6b6b}
.tv-tab.on .up,.tv-tab.on .dn{color:#fff}
.tv-box{flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#131722}
.tv-box iframe{width:100%;height:100%}
@container (max-width:230px){.tv-tab span{display:none}}

/* Radyo */
.w[data-id=radio]{--w-bg:linear-gradient(160deg,rgba(236,100,74,.96),rgba(142,34,62,.97));--acc:#ffe08a}
.rd{display:flex;flex-direction:column;height:100%;gap:8px;min-height:0;container-type:size}
.rd-now{display:flex;align-items:center;gap:10px;flex:none;padding:7px 10px;border-radius:16px;background:rgba(0,0,0,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.rd-dot{width:7px;height:7px;border-radius:50%;background:var(--c,#fff);flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.rd-inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rd-nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-sl{display:flex;align-items:center;gap:6px;min-width:0}
.rd-st{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rd-st.err{color:#ffd0c8}
.rd-eq{display:none;align-items:flex-end;gap:2px;width:12px;height:11px;flex:none}
.rd.live .rd-eq{display:flex}
.rd-eq i{flex:1;height:30%;border-radius:1px;background:var(--acc);animation:rdeq .8s ease-in-out infinite alternate}
.rd-eq i:nth-child(2){animation-duration:.55s;animation-delay:-.2s}.rd-eq i:nth-child(3){animation-duration:.95s;animation-delay:-.4s}
@keyframes rdeq{0%{height:20%}100%{height:100%}}
/* Radyo: kanal logoları, dönen plak, canlı rozeti */
.rd-lg{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none;overflow:hidden;background:var(--c,#fff);color:#fff;font-weight:800;font-size:11px;line-height:1;box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.rd-lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.rd-disc{position:relative;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle at 50% 50%,#1b1014 0 2px,#2c1b22 2px 3px);box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14);animation:rdspin 6s linear infinite;animation-play-state:paused}
.rd-disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(255,255,255,.18) 25%,transparent 32% 70%,rgba(255,255,255,.12) 75%,transparent 82%)}
.rd.live .rd-disc{animation-play-state:running}
.rd-disc .rd-lg{width:26px;height:26px;font-size:7.5px;letter-spacing:-.02em;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.rd-disc .rd-lg0{background:#3a2229;font-size:13px;font-weight:400;color:rgba(255,255,255,.7)}
.rd-badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;background:#e5322d;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;line-height:1.5}
.rd-badge i{width:6px;height:6px;border-radius:50%;background:#fff;animation:rdlive 1.4s ease-in-out infinite}
.rd-br{margin-left:6px;font-size:10.5px;opacity:.8}
.rd-spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rdspin .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes rdspin{to{transform:rotate(360deg)}}
@keyframes rdlive{50%{opacity:.25}}
html[data-lite="1"] .rd-disc,html[data-lite="1"] .rd-badge i{animation:none}
@media (prefers-reduced-motion:reduce){.rd-disc,.rd-badge i,.rd-spin{animation:none}}
@container (max-width:250px){.rd-disc{display:none}}
@container (max-width:420px){.rd-br{display:none}}
.rd-pl{appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#6b1d2a;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .15s}
.rd-pl:active{transform:scale(.94)}.rd-pl svg{width:19px;height:19px}
.rd-sk{appearance:none;border:0;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--t);cursor:pointer;display:grid;place-items:center;flex:none}
.rd-sk svg{width:14px;height:14px}
.rd-vol{display:flex;align-items:center;gap:8px;flex:none;color:var(--t2)}
.rd-vol svg{width:16px;height:16px;flex:none}
.rd-vol input{flex:1;min-width:0;accent-color:var(--acc);height:16px}
.rd-ctl{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.rd-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:none;min-width:0}
.rd-it{appearance:none;border:0;background:rgba(0,0,0,.2);color:var(--t);font:inherit;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;cursor:pointer;flex:none;white-space:nowrap}

  .hd{min-height:24px}
  .ibtn{width:24px;height:24px}
  .wx{flex-direction:row;align-items:center;gap:10px}
  .wx-top{flex-direction:column;gap:2px;order:2;flex:1;min-width:0}
  .wx-cond{text-align:left}
  .wx-main{order:1;flex:none;gap:8px}
  .wx-hilo,.wx-hours,.wx-days{display:none!important}
  .wx-icon svg{width:46px}.wx-temp{font-size:46px}
  .pr-times,.pr .foot{display:none}
  .pr-cd{font-size:clamp(22px,8cqw,34px)}
  .tv-box,.yt-view,.tvp-main{display:none}
  .fx-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;align-content:start}
  .fx-r{grid-template-columns:22px 1fr auto!important;padding:3px 0;gap:6px!important}
  .fx-list{gap:2px 10px!important}
  .fx-n b{font-size:12px}
  .dv .ttl{display:none}
  .fx-sp,.fx .foot,.fx-n span{display:none!important}
  .fx-fl{width:22px;height:22px}
  .fx-v b{font-size:12px;letter-spacing:-.02em}.fx-v span{display:none}
  .nw .foot{display:none}
  .nw-i{padding:6px 0}.nw-i b{font-size:13px!important;-webkit-line-clamp:2}.nw-i span{margin-top:1px}
  .nt textarea{font-size:13px;line-height:22px;background-image:repeating-linear-gradient(transparent 0 21px,rgba(59,42,5,.16) 21px 22px)}
  .dv-q{font-size:clamp(12px,3.4cqw,15px)}
  .dv-f{gap:6px}
  .es-n h3{font-size:clamp(20px,8cqw,30px)}.es-n p{font-size:12px}

/* Kontrol widget'ı: Sade · Tema · Düzenle */
.w[data-id=controls]{--w-bg:linear-gradient(160deg,rgba(64,72,112,.95),rgba(24,26,48,.97));--acc:#7aa8ff}
.w[data-id=controls] .w-minus{display:none!important}   /* Düzenle düğmesi burada: kaldırılamasın */
.bk-ov{position:fixed;inset:0;z-index:1000;background:rgba(5,6,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.bk{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--pop);color:var(--fg);border:1px solid var(--hairline);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.bk h3{margin:0;font-size:18px;font-weight:700}
.bk p{margin:0;font-size:13.5px;line-height:1.5;color:var(--fg2)}
.bk-ck{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.bk-ck input{margin-top:2px;accent-color:#0a84ff}
.bk-row{display:flex;gap:8px;flex-wrap:wrap}
.bk-b{appearance:none;flex:1;min-width:120px;border:1px solid var(--hairline);background:var(--glass);color:var(--fg);font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:999px;cursor:pointer}
.bk-b:hover{background:rgba(127,127,127,.22)}
.bk-b.on{background:#0a84ff;border-color:transparent;color:#fff}
.bk-b[hidden]{display:none}
.bk-msg{min-height:1.4em;font-size:13px;line-height:1.45;color:var(--fg)}
.ctl{--g:8px;flex:1;min-height:0;container-type:size;display:grid;grid-template-columns:repeat(2,max-content);justify-content:center;align-content:center;gap:var(--g)}   /* her sırada 2 kare düğme */
.ctl button{appearance:none;width:min(calc((100cqw - var(--g)) / 2),calc((100cqh - var(--g)) / 2));aspect-ratio:1;min-width:0;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);color:#fff;border-radius:16px;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,background .2s}
.ctl button:hover{background:rgba(255,255,255,.22)}
.ctl button:active{transform:scale(.96)}
.ctl button.on{background:#0a84ff;border-color:transparent}
.ctl button svg{width:50%;max-width:30px;height:auto;aspect-ratio:1;display:block}
/* 1x1 (dar) kutuda: başlık gizlenir, üç düğme alt alta dizilir */
@container (max-width:210px){.ctlw .hd{display:none}.ctlw .ctl{--g:6px}.ctlw .ctl button{border-radius:13px}}

/* Yeni oyunlar / film ve etkinlik */
.w[data-id=games]{--w-bg:radial-gradient(circle at 90% 0%,rgba(167,139,250,.32),transparent 55%),linear-gradient(160deg,rgba(54,22,112,.96),rgba(16,9,46,.98));--acc:#b79cff}
.w[data-id=events]{--w-bg:radial-gradient(circle at 95% 0%,rgba(255,170,80,.3),transparent 55%),linear-gradient(160deg,rgba(120,50,16,.96),rgba(38,14,10,.98));--acc:#ffb454;--on:#3a1c08}
.cvw .dv-tabs{margin-right:2px}
.cvb{flex:1;min-height:0;display:flex;flex-direction:column}
.cv{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:12px 10px;overflow:hidden;align-content:start;padding:2px 2px 6px}
.cv.land{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cv-c{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
.cv-c[hidden]{display:none!important}
.cv-img{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.1);box-shadow:0 10px 22px -10px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.cv.land .cv-img{aspect-ratio:16/10}
.cv.cmp .cv-img{height:var(--ph);aspect-ratio:auto}
.cv.nt .cv-t,.cv.nt .cv-s{display:none}
.cv-img img{width:100%;height:100%;object-fit:cover;display:block}
.cv-c:hover .cv-img{transform:translateY(-3px) scale(1.025);box-shadow:0 16px 28px -10px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.3)}
.cv-c:focus-visible{outline:2px solid #4da3ff;outline-offset:3px;border-radius:12px}
.cv-date{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.02em;white-space:nowrap}
.cv-t{font-size:12.5px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv-s{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.cv-img.sk{background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.2),rgba(255,255,255,.08));background-size:200% 100%;animation:sk 1.2s infinite}
.kp{margin:auto;width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;text-align:center;align-items:stretch}
.kp b{font-size:14.5px}
.kp p{margin:0;font-size:12px;line-height:1.45;color:var(--t2)}
.kp a{color:var(--acc);font-weight:700;font-size:12.5px;text-decoration:none}
.kp .yt-go{background:var(--acc);color:#1b1030}
.cvf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cvf-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--t2);flex:none;font-variant-numeric:tabular-nums}
.pgb{appearance:none;border:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);color:var(--t);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.pgb:hover{background:rgba(255,255,255,.3)}
.kp-b{appearance:none;border:0;background:transparent;color:var(--t2);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:2px}
.nw-msg button{color:#1b1030}
@container (max-height:175px){
  .cv{display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;padding:0}
  .cv-c{flex:none;height:100%}
  .cv-img{height:100%;aspect-ratio:2/3}
  .cv.land .cv-img{aspect-ratio:16/10}
  .cv-t,.cv-s{display:none}
  .cv-date{left:50%;top:auto;bottom:4px;translate:-50% 0;font-size:9px;padding:1px 6px}
  .kp p,.kp a{display:none}
}


/* ====== Mobil ve dokunmatik iyileştirmeler ====== */
button,.ibtn,.pill,.pc-k,.pc-pw,.tvp-c,.rd-it,.nt-tab,.tv-tab{touch-action:manipulation}
.w-in{-webkit-touch-callout:none}
@media (max-width:760px){
  :root{--radius:24px}
  /* Küçük ekranda 12+ widget'ın canlı bulanıklığı GPU'yu yorar: yarıçap düşürülür */
  .w{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
  .sb,.pill{backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
  .date{text-align:left}
  .top{margin-bottom:14px}
}
@media (max-width:520px){
  :root{--radius:22px}
  .clock{font-size:clamp(34px,13vw,52px)}
}
@media (pointer:coarse){
  /* iOS Safari, 16px altı alanlara odaklanınca sayfayı yakınlaştırır */
  input:not([type=range]):not([type=file]):not([type=checkbox]),textarea{font-size:16px!important}
  .ibtn{width:34px;height:34px}
  .ibtn svg{width:16px;height:16px}
  .pgb{width:30px;height:30px;font-size:18px}
  .dv-tabs button{padding:7px 12px}
  .nt-tab{padding:7px 13px}
  .tray button{padding:11px 16px}
  .w-minus{width:32px;height:32px}
  .rd-it{padding:9px 16px}
  .pill{padding:11px 16px}
  .tvp-c{padding:8px 10px}
}
@media (hover:none){
  .cv-c:hover .cv-img{transform:none;box-shadow:0 10px 22px -10px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.14)}
  .pill:hover{transform:none}
}
@media (max-height:480px) and (orientation:landscape){
  .shell{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
}

/* Sade mod ve düzenleme: bulanıklık (blur) kapalı, GPU yükü düşük */
html[data-lite="1"] .w,.editing .w{backdrop-filter:none;-webkit-backdrop-filter:none}
/* Sade mod, eski bilgisayarlar için: her yerde bulanıklık, geçiş ve animasyon kapalı (haber şeridi hariç), widget'lar 3B katman olmaz,
   büyük gölgeler kalkar. Video oynarken tarayıcı her kare için bunları yeniden çizmek zorunda kalıyordu. */
html[data-lite="1"] *,html[data-lite="1"] *::before,html[data-lite="1"] *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:none!important}
html[data-lite="1"] body:not(.editing) *:not(.tk-track),html[data-lite="1"] body:not(.editing) *::before,html[data-lite="1"] body:not(.editing) *::after{animation:none!important}
html[data-lite="1"] .w{transform:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
html[data-lite="1"] .w::after{display:none}
@media (prefers-reduced-motion:reduce){.editing .w{animation:none}.skel,.spin{animation:none}}
</style>

}

function parseRSS(xml){
  const d=new DOMParser().parseFromString(xml,'text/xml');
  return [...d.querySelectorAll('item,entry')].slice(0,30).map(i=>{
    const g=t=>i.querySelector(t)?.textContent?.trim()||'';
    const link=g('link')||i.querySelector('link')?.getAttribute('href')||'';
    return{title:g('title'),link,date:g('pubDate')||g('published')||g('updated'),source:g('source')};
  }).filter(x=>x.title&&safeUrl(x.link));

function ago(s){
  const t=Date.parse(s);if(!t)return'';
  const m=Math.round((Date.now()-t)/6e4);
  if(m<1)return'şimdi';if(m<60)return m+' dk önce';
  const h=Math.round(m/60);if(h<24)return h+' sa önce';
  const d=Math.round(h/24);return d===1?'dün':d+' gün önce';
}

const HIJRI=['Muharrem','Safer','Rebiülevvel','Rebiülahir','Cemaziyelevvel','Cemaziyelahir','Recep','Şaban','Ramazan','Şevval','Zilkade','Zilhicce'];
function secsIn(tz){
  const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return(+p.hour%24)*3600+(+p.minute)*60+(+p.second);
}
/* ---------- Dini günler (hicri tarihten hesaplanır, tarih tablosu tutulmaz) ---------- */
/* Hicri tarih tarayıcının Umm el-Kura takviminden gelir; Diyanet'in yayımladığı listelerle gün gün karşılaştırıldı (2026-27 kandiller, Ramazan, bayramlar, 2027 Mevlid, Hicri Yılbaşı, Aşure).
   Kandiller bir önceki akşam başlar: Diyanet listesindeki miladi gün, gecenin adındaki hicri günden bir önceki gündür (Miraç 27. gece → 26 Recep). */
const HJ_FMT=(()=>{try{return new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'})}catch{return null}})();
function hijriAt(ms){
  if(!HJ_FMT)return null;
  try{const p={};HJ_FMT.formatToParts(new Date(ms)).forEach(x=>{p[x.type]=x.value});const d=+p.day,m=+p.month,y=+p.year;return d>0&&m>0&&y>0?{d,m,y}:null}catch{return null}
}
/* base: bugünün miladi tarihi, UTC öğle saati (ms). Dönüş: {n:ad, off:kaç gün sonra, night:gece mi, k:bayramın kaçıncı günü (varsa)} */
function nextReligiousDay(base){
  const H=i=>hijriAt(base+i*864e5),t=H(0);
  if(!t)return null;
  if(t.m===10&&t.d<=3)return{n:'Ramazan Bayramı',off:0,k:t.d};          /* bayramın içindeyiz */
  if(t.m===12&&t.d>=10&&t.d<=13)return{n:'Kurban Bayramı',off:0,k:t.d-9};
  for(let i=0;i<=400;i++){
    const h=i?H(i):t,nx=H(i+1);if(!h||!nx)continue;
    let n=null,night=false;
    /* Regaip: Recep'in ilk Cuma gecesi, yani o Cuma'dan bir önceki Perşembe akşamı. */
    if(new Date(base+i*864e5).getUTCDay()===4&&nx.m===7&&nx.d<=7){n='Regaip Kandili';night=true}
    else if(h.m===7&&h.d===1)n='Üç Aylar Başlangıcı';
    else if(h.m===7&&h.d===26){n='Miraç Kandili';night=true}
    else if(h.m===8&&h.d===14){n='Berat Kandili';night=true}
    else if(h.m===9&&h.d===1)n='Ramazan Başlangıcı';
    else if(h.m===9&&h.d===26){n='Kadir Gecesi';night=true}
    else if(nx.m===10&&nx.d===1)n='Ramazan Bayramı arefesi';
    else if(h.m===10&&h.d===1)n='Ramazan Bayramı';
    else if(h.m===12&&h.d===9)n='Kurban Bayramı arefesi';
    else if(h.m===12&&h.d===10)n='Kurban Bayramı';
    else if(h.m===1&&h.d===1)n='Hicri Yılbaşı';
    else if(h.m===1&&h.d===10)n='Aşure Günü';
    else if(h.m===3&&h.d===11){n='Mevlid Kandili';night=true}
    if(n)return{n,off:i,night};
  }
  return null;
}
function religiousText(r){
  if(r.k)return r.n+' · '+r.k+'. gün';
  if(r.off===0)return(r.night?'Bu gece':'Bugün')+' · '+r.n;
  if(r.off===1)return(r.night?'Yarın gece':'Yarın')+' · '+r.n;
  return r.n+' · '+r.off+' gün sonra';
}

    }else{rem=secs[ni]-now;name=PRAYERS[ni][1];at=data.timings[PRAYERS[ni][0]].match(/\d{1,2}:\d{2}/)[0]}
    const hh=Math.floor(rem/3600),mm=Math.floor(rem%3600/60),ss=rem%60;
    /* .pr-at yalnızca vakit ızgarası gizliyken (küçük boyut) görünür; büyük boyutta saat ızgarada zaten var. */
    $('#pnm',root).innerHTML=esc(PRAYER_LABEL[ni])+'<span class="pr-at"> · '+at+'</span><b>'+name+' vaktine kalan</b>';
    $('#pcd',root).textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    const ptmHtml=PRAYERS.map((p,i)=>'<div class="pt'+(i===ni&&now<secs[5]+1&&secs.findIndex(s=>s>now)>=0?' next':'')+(secs[i]<=now?' past':'')+'"><span>'+p[1]+'</span><b>'+data.timings[p[0]].match(/\d{1,2}:\d{2}/)[0]+'</b></div>').join('');
    if(ptmHtml!==w._ptm){w._ptm=ptmHtml;$('#ptm',root).innerHTML=ptmHtml}
  };
  /* Bugünün tarihi, seçili şehrin saat dilimine göre alınır (cihaz saatine göre değil). */
  const today=()=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date()).replace(/\//g,'-');
  /* Tarihin altına en yakın dini gün: bayram, kandil, Ramazan başlangıcı vb. Hesaplanamazsa satır gizlenir. */
  const paintEv=()=>{
    const el=$('#pev',root);if(!el)return;
    const [dd,mm,yy]=today().split('-').map(Number);
    let r=null;try{r=nextReligiousDay(Date.UTC(yy,mm-1,dd,12))}catch{}
    el.textContent=r?religiousText(r):'';
    el.title=r?new Date(Date.UTC(yy,mm-1,dd+r.off,12)).toLocaleDateString('tr-TR',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric',weekday:'long'})+(r.night?' (akşamı başlar)':''):'';
  };
  /* Yarının İmsak saati (yalnızca Yatsı ile gece yarısı arasında gerekir). Hata olursa 60 sn sonra yeniden dener. */
  let tom=null,tomBusy=false,tomRetry=0;
  const tomKey=()=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(Date.now()+864e5)).replace(/\//g,'-')+'|'+place.lat.toFixed(2)+'|'+place.lon.toFixed(2);
  const loadTom=async()=>{
    const key=tomKey();
    if(tomBusy||(tom&&tom.key===key)||Date.now()<tomRetry)return;
    tomBusy=true;
    try{
      const r=await getJSON('https://api.aladhan.com/v1/timings/'+key.split('|')[0]+'?latitude='+place.lat+'&longitude='+place.lon+'&method=13');
      const m=r.data.timings.Fajr.match(/\d{1,2}:\d{2}/);
      if(!m)throw new Error('fajr');
      tom={key,fajr:m[0]};
    }catch{tomRetry=Date.now()+60e3}
    tomBusy=false;
  };
  let tzFix=false;
  const load=async()=>{
    const dd=today();
    const key=dd+'|'+place.lat.toFixed(2)+'|'+place.lon.toFixed(2);
    let j=null;
    const cache=LS.get('pano.prayer',null);
    if(cache&&cache.key===key)j=cache.j;
    else{
      try{const r=await getJSON('https://api.aladhan.com/v1/timings/'+dd+'?latitude='+place.lat+'&longitude='+place.lon+'&method=13');j=r.data;LS.set('pano.prayer',{key,j})}
      catch{if(cache)j=cache.j}
    }
    if(!j){$('#pnm',root).textContent='Vakitler alınamadı';status('pr',false);return}
    const newTz=(j.meta&&j.meta.timezone)||tz,tzChanged=newTz!==tz;
    data=j;status('pr',true);tz=newTz;
    secs=PRAYERS.map(p=>{const m=j.timings[p[0]].match(/(\d{1,2}):(\d{2})/);return(+m[1])*3600+(+m[2])*60});
    const h=j.date&&j.date.hijri;if(h)$('#hj',root).textContent=h.day+' '+(HIJRI[(+h.month.number)-1]||'')+' '+h.year;
    paintEv();
    $('#pcity',root).textContent=place.name.split(',')[0];
    draw();
    /* Saat dilimi değiştiyse (ör. başka ülke seçildi) doğru günün vakitleri için bir kez daha yükle. */
    if(tzChanged&&!tzFix){tzFix=true;load()}else tzFix=false;
  };
  /* Gün değişince (gece yarısı) vakitleri hemen yeniden çek; eski güne ait sayaç çalışmasın. */
  let day=today();
  load();every(w,()=>{draw();const d=today();if(d!==day){day=d;load()}},1000);every(w,load,3600e3);onBus(w,'place',load);onBus(w,'refresh',load);
}

/* Video/liste kimlikleri href, style ve iframe src içine yazıldığı için biçimi doğrulanır. */
function parseYT(s){
  const p=parseYTraw(s);if(!p)return null;
  if(p.v&&!/^[\w-]{6,20}$/.test(p.v))return null;
  if(p.list&&!/^[\w-]{10,64}$/.test(p.list)){if(p.v)p.list=null;else return null}
  if(!p.v&&!p.list)return null;
  return p;
}
function parseYTraw(s){
  s=(s||'').trim();if(!s)return null;
  if(/^[\w-]{11}$/.test(s))return{v:s};
  let u;try{u=new URL(/^https?:/.test(s)?s:'https://'+s)}catch{return null}
  const h=u.hostname.replace(/^www\.|^m\./,'');
  const list=u.searchParams.get('list');
  if(h==='youtu.be'){const v=u.pathname.slice(1).split('/')[0];return v?{v,list}:null}
  if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){
    const v=u.searchParams.get('v');if(v)return{v,list};
    const m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{6,})/);if(m)return{v:m[1],list};
    if(list)return{list};
  }
  return null;
}
/* YouTube kanalları: @kullanıcı adıyla eklenir; canlı olanlar listenin başında görünür. Canlı durum için kullanıcının kendi (ücretsiz) YouTube Data API anahtarı gerekir,
   çünkü YouTube sayfaları tarayıcıdan anahtarsız okunamıyor. Anahtar yalnızca bu tarayıcıda saklanır (pano.key.youtube). */
const YT_MAX=30;
async function ytApi(path,params,key){
  const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set('key',key);
  const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
  try{
    const r=await fetch(u,{signal:c.signal});const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason||String(r.status));e.status=r.status;throw e}
    return j;
  }finally{clearTimeout(t)}
}
/* "@ntv", "ntv", "youtube.com/@ntv", "youtube.com/channel/UC…", "youtube.com/user/ad", "youtube.com/c/ad" → API sorgu parametresi; video/liste bağlantısı ya da başka bir şey ise null */
function ytChannelSpec(v){
  v=String(v||'').trim();if(!v||parseYT(v))return null;
  let m=v.match(/^(?:https?:\/\/)?(?:www\.|m\.)?youtube\.com\/(?:(@[\w.%-]+)|channel\/(UC[\w-]{22})|user\/([\w.%-]+)|c\/([\w.%-]+))/i);
  if(m){if(m[1])return{forHandle:decodeURIComponent(m[1])};if(m[2])return{id:m[2]};if(m[3])return{forUsername:decodeURIComponent(m[3])};return{forHandle:'@'+decodeURIComponent(m[4])}}
  if(/^@[\p{L}\p{N}_.-]{2,30}$/u.test(v))return{forHandle:v};
  if(/^[\p{L}\p{N}_.-]{3,30}$/u.test(v))return{forHandle:'@'+v};
  return null;
}

      '<form class="yt-in" id="ytk"><input type="text" autocomplete="off" spellcheck="false" placeholder="Anahtarı yapıştır" aria-label="YouTube API anahtarı"><button class="yt-go" type="submit">Kaydet</button></form>'+
      (key?'<button type="button" class="kp-b" data-a="rm">Kayıtlı anahtarı sil</button>':'')+'<button type="button" class="kp-b" data-a="close">Kapat</button>'+'</div>';

      :!key?'Canlı durum için YouTube API anahtarı gerekli. <button type="button" class="kp-b" data-a="key">Anahtar ekle</button>'
      :apiErr?esc(apiErr)+' <button type="button" class="kp-b" data-a="key">Anahtarı değiştir</button>'
      :!loaded?'Canlı yayınlar kontrol ediliyor…'

  /* Kanal başına son 15 yükleme (1 birim) + hepsi için tek videos sorgusu (1 birim): canlı olan, başlamış ve bitmemiş yayındır. */
  async function refresh(){
    const key=getKey('youtube');
    if(busy||!chs.length||!key||root.hidden)return;
    busy=true;let err=null;
    try{
      const ups=await Promise.all(chs.map(c=>ytApi('playlistItems',{part:'contentDetails',playlistId:'UU'+c.id.slice(2),maxResults:15},key)
        .then(j=>({c,ids:(j.items||[]).map(x=>x.contentDetails&&x.contentDetails.videoId).filter(Boolean)}))
        .catch(e=>{if(e.status!==404)err=err||e;return{c,ids:[],failed:e.status!==404}})));
      const all=[...new Set(ups.flatMap(u=>u.ids))],vids={};
      for(let k=0;k<all.length;k+=50){
        try{const j=await ytApi('videos',{part:'liveStreamingDetails,snippet',id:all.slice(k,k+50).join(',')},key);(j.items||[]).forEach(v=>{vids[v.id]=v})}
        catch(e){err=err||e;ups.forEach(u=>{if(u.ids.some(id=>all.slice(k,k+50).includes(id)))u.failed=true})}

      const j=await ytApi('channels',{part:'snippet',...spec},key),it=j.items&&j.items[0];

  if(saved){inp.value=saved;play(saved)}else idle();
  $('#ytf',root).addEventListener('submit',e=>{e.preventDefault();submit(inp.value)});
  inp.addEventListener('paste',()=>setTimeout(()=>{const v=inp.value;if(parseYT(v)){cur=null;drawList();play(v)}else if(/youtube\.com\/(@|channel\/|user\/|c\/)/i.test(v))submit(v)},30));
  list.addEventListener('click',e=>{
    const x=e.target.closest('[data-rm]');
    if(x){const id=x.dataset.rm;chs=chs.filter(c=>c.id!==id);delete info[id];LS.set('pano.yt.ch',chs);if(cur===id){cur=null;idle()}drawList();return}
    const b=e.target.closest('.kk-c');if(b)playCh(b.dataset.s);
  });
  view.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const a=b.dataset.a;
    if(a==='key')keyPanel();
    else if(a==='rm'){LS.set('pano.key.youtube','');Object.keys(info).forEach(k=>delete info[k]);loaded=false;apiErr='';drawList();idle()}
    else if(a==='close'){pending=null;const sv=LS.get('pano.yt','');if(sv)play(sv);else idle()}
  });
  view.addEventListener('submit',e=>{
    const f=e.target.closest('#ytk');if(!f)return;e.preventDefault();
    const v=$('input',f).value.trim();if(!/^[\w-]{20,60}$/.test(v)){$('input',f).value='';$('input',f).placeholder='Anahtar geçersiz görünüyor';return}
    LS.set('pano.key.youtube',v);apiErr='';loaded=false;idle();
    const p=pending;pending=null;if(p)addCh(p);refresh();
  });
  drawList();refresh();every(w,refresh,5*60e3);
  return{off(){cur=null;view.innerHTML='';playing=false},on(){cur=null;drawList();const sv=LS.get('pano.yt','');if(sv)play(sv);else idle();refresh()}};
}

/* ---------- X (Twitter) gömülü zaman akışı ---------- */
/* Resmî widgets.js ile profil akışı. X, akışı yalnızca aynı tarayıcıda X'e giriş yapılmışsa gösterir (giriş yoksa "Nothing to see here"). */
/* ---------- Video: bilgisayardan seçilen dosyayı oynat ---------- */
/* Dosya, sayfa yenilense de kalsın diye IndexedDB'de tutulur (en son seçilen tek video). */
const VDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('pano-video',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();try{return await new Promise((res,rej)=>{const t=db.transaction('f',mode),rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error)})}finally{db.close()}},
  get(){return this.run('readonly',s=>s.get('last'))},
  put(v){return this.run('readwrite',s=>s.put(v,'last'))},
  del(){return this.run('readwrite',s=>s.delete('last'))}

function mountVideo(w,root,tabs){
  root.innerHTML='<div class="yt">'+hd('video','Video',tabs+sbBtn)+
   '<div class="yt-in"><input id="vdn" type="text" readonly placeholder="Bilgisayardan video seç" aria-label="Seçilen video"><button class="yt-go" type="button" id="vdp">Video seç</button><button class="yt-go alt" type="button" id="vdx" hidden>Kaldır</button></div>'+
   '<input id="vdf" type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.ogv,.mkv" hidden>'+
   '<div class="yt-view" id="vdv"></div></div>';
  sbWire(root);
  const view=$('#vdv',root),nameEl=$('#vdn',root),file=$('#vdf',root),rm=$('#vdx',root);
  let url=null,video=null;
  const free=()=>{if(video){try{video.pause();video.removeAttribute('src');video.load()}catch{}video=null}if(url){URL.revokeObjectURL(url);url=null}};
  const empty=msg=>{free();rm.hidden=true;nameEl.value='';view.innerHTML='<div class="yt-empty pick" id="vde"><svg viewBox="0 0 64 44"><rect width="64" height="44" rx="12" fill="#b08cff"/><path d="M26 12v20l18-10z" fill="#fff"/></svg><div>'+msg+'</div></div>'};
  const EMPTY='Bir video dosyası seç ya da buraya sürükle.<br>Seçtiğin video burada oynar.';
  const warn=m=>{const d=document.createElement('div');d.className='tvp-err';d.textContent=m;view.appendChild(d)};
  function play(blob,name,auto){
    free();url=URL.createObjectURL(blob);
    view.innerHTML='<video controls playsinline'+(auto?' autoplay':'')+'></video>';
    video=$('video',view);video.src=url;
    nameEl.value=name;nameEl.title=name;rm.hidden=false;
    video.addEventListener('error',()=>warn('Bu video tarayıcıda oynatılamıyor. Dosya biçimi ya da kodek desteklenmiyor olabilir (MP4/H.264 ve WebM en güvenlisi).'),{once:true});
    if(auto)video.play().catch(()=>{});
  }
  async function pick(f){
    if(!f)return;
    if(!(f.type||'').startsWith('video/')&&!/\.(mp4|m4v|mov|webm|ogv|mkv)$/i.test(f.name)){empty('Bu bir video dosyası değil.<br>MP4, WebM ya da MOV seç.');return}
    play(f,f.name,true);
    try{await VDB.put({blob:f,name:f.name})}catch{warn('Video kalıcı olarak kaydedilemedi (depolama dolu olabilir). Sayfayı yenileyince silinir.')}
  }
  $('#vdp',root).addEventListener('click',()=>file.click());
  nameEl.addEventListener('click',()=>file.click());
  view.addEventListener('click',e=>{if(e.target.closest('#vde'))file.click()});
  file.addEventListener('change',()=>{const f=file.files[0];file.value='';pick(f)});
  rm.addEventListener('click',async()=>{empty(EMPTY);try{await VDB.del()}catch{}});
  const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
  view.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();view.classList.add('drag')});
  view.addEventListener('dragleave',()=>view.classList.remove('drag'));
  view.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();view.classList.remove('drag');pick(e.dataTransfer.files[0])});
  empty(EMPTY);
  (async()=>{try{const r=await VDB.get();if(r&&r.blob&&!video)play(r.blob,r.name||'Video',false)}catch{}})();
  return{off(){if(video)video.pause()},on(){},dispose:free};
}

/* ---------- Kick: eklediğin kanallar, canlı olanlar üstte, tıklayınca burada oynar ---------- */
/* Kick'in takip listesi giriş oturumu olmadan okunamaz, bu yüzden kanallar elle eklenir ve bu tarayıcıda saklanır.
   Canlı durum kick.com/api/v2/channels/{kanal} adresinden (tarayıcıdan okunabiliyor), oynatıcı Kick'in resmî player.kick.com gömmesidir. */
const KICK_SLUG=/^[a-z0-9][a-z0-9_-]{0,31}$/i;
/* "kick.com/xqc", "https://kick.com/xqc/videos", "@xqc", "xqc" ve boşluk/virgülle ayrılmış listeleri kabul eder. */
function kickSlugs(text){
  const out=[];
  String(text||'').split(/[\s,;]+/).forEach(tok=>{
    let t=tok.trim().replace(/^@/,'');if(!t)return;
    t=t.replace(/^https?:\/\//i,'').replace(/^(www\.|player\.)?kick\.com\//i,'').split(/[/?#]/)[0].toLowerCase();
    if(KICK_SLUG.test(t)&&!out.includes(t))out.push(t);
  });
  return out;
}
function mountKick(w,root,tabs){
  const MAX=40,PH='Kanal ekle: kick.com/kullanıcı ya da kullanıcı adı';
  root.innerHTML='<div class="tvp">'+hd('kick','<span lang="en">Kick</span>',tabs+sbBtn+'<button class="ibtn" type="button" id="kkt" title="Kanal listesini aç/kapat" aria-label="Kanal listesini aç/kapat" aria-pressed="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>')+
   '<form class="yt-in" id="kkf"><input id="kki" type="text" placeholder="'+PH+'" aria-label="Kick kanalı ekle" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="yt-go" type="submit">Ekle</button></form>'+
   '<div class="tvp-main"><div class="tvp-vid" id="kkv"></div><div class="tvp-side"><div class="tvp-list noscroll" id="kkl"></div></div></div></div>';
  sbWire(root);
  const tvp=$('.tvp',root),tgl=$('#kkt',root),vid=$('#kkv',root),list=$('#kkl',root),inp=$('#kki',root);
  listWire(tvp,tgl);
  let chs=LS.get('pano.kick.ch',[]);
  chs=(Array.isArray(chs)?chs:[]).filter(s=>typeof s==='string'&&KICK_SLUG.test(s)).slice(0,MAX);
  const info={};let cur=null,busy=false,phT=0,loaded=false;
  const okImg=u=>/^https:\/\/[\w.-]+\.kick\.com\//i.test(u||'');
  const fmtV=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+' B':String(n);   /* B = bin */
  const note=m=>{vid.innerHTML='<div class="yt-empty"><svg viewBox="0 0 64 56" style="width:56px;height:auto"><rect x="4" y="6" width="56" height="44" rx="12" fill="#53fc18"/><circle cx="32" cy="28" r="6" fill="#07210a"/><path d="M19 17a16 16 0 0 0 0 22M45 17a16 16 0 0 1 0 22" stroke="#07210a" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg><div>'+m+'</div></div>'};
  const idle=()=>{
    const n=chs.filter(s=>info[s]&&info[s].live).length;
    note(!chs.length?'Takip ettiğin Kick kanallarını ekle.<br>Canlı olanlar listenin başında görünür, tıklayınca burada oynar.'
      :!loaded?'Canlı yayınlar kontrol ediliyor…'
      :chs.every(s=>info[s]&&info[s].err)?'Kick\'e ulaşılamadı. Biraz sonra kendiliğinden yeniden denenecek.'
      :n?'<b>'+n+'</b> kanal şu an canlı. Listeden birine tıkla.':'Eklediğin kanalların hiçbiri şu an yayında değil.');
  };
  const flash=m=>{inp.placeholder=m;clearTimeout(phT);phT=setTimeout(()=>{inp.placeholder=PH},4500)};
  const order=()=>[...chs].sort((a,b)=>{const A=info[a]||{},B=info[b]||{};if(!!A.live!==!!B.live)return B.live?1:-1;if(A.live)return(B.viewers||0)-(A.viewers||0);return a.localeCompare(b)});

    list.innerHTML=order().map(s=>{
      const i=info[s]||{},nm=i.name||s,live=!!i.live;
      const av=okImg(i.pic)?'<img src="'+esc(i.pic)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="tvp-n">'+esc(nm.slice(0,1).toUpperCase())+'</span>';
      const tip=live?(i.title||'')+(i.cat?' · '+i.cat:''):i.nf?'Kanal bulunamadı':i.err?'Durumu alınamadı':'Şu an yayında değil';
      return'<div class="kk-r"><button type="button" class="tvp-c kk-c'+(live?' live':'')+(s===cur?' on':'')+'" data-s="'+esc(s)+'" title="'+esc(tip)+'">'+av+'<span class="kk-n">'+esc(nm)+'</span>'+(live?'<span class="kk-v"><i class="kk-dot"></i>'+fmtV(i.viewers||0)+'</span>':'')+'</button>'+
        '<button type="button" class="kk-x" data-rm="'+esc(s)+'" aria-label="'+esc(nm)+' kanalını listeden çıkar" title="Listeden çıkar">×</button></div>';
    }).join('');
  }
  async function fetchOne(s){
    try{
      const j=await getJSON('https://kick.com/api/v2/channels/'+encodeURIComponent(s),9000);
      const l=j&&j.livestream,c=l&&Array.isArray(l.categories)&&l.categories[0];
      info[s]={name:String((j.user&&j.user.username)||j.slug||s),pic:(j.user&&j.user.profile_pic)||'',live:!!l,viewers:l?(+l.viewer_count||0):0,title:l?String(l.session_title||''):'',cat:c?String(c.name||''):''};

    }
  }
  async function refresh(){
    if(busy||!chs.length||root.hidden)return;
    busy=true;
    try{await Promise.all(chs.map(fetchOne))}finally{busy=false;loaded=true}
    drawList();if(!cur)idle();
  }
  function play(s){
    const i=info[s]||{};cur=s;drawList();

    if(!i.live&&!i.err){   /* durumu bilinmeyen kanalda yine de oynatıcı açılır; yayın varsa görünür */note('<b>'+esc(i.name||s)+'</b> şu an yayında değil.<br><a class="kk-open" href="https://kick.com/'+encodeURIComponent(s)+'" target="_blank" rel="noopener noreferrer">Kick\'te aç</a>');return}
    vid.innerHTML='<iframe title="Kick: '+esc(i.name||s)+'" src="https://player.kick.com/'+encodeURIComponent(s)+'?autoplay=true" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';

    await Promise.all(fresh.map(fetchOne));

    bad.forEach(s=>delete info[s]);
    chs=chs.concat(fresh.filter(s=>!bad.includes(s)));LS.set('pano.kick.ch',chs);

  }
  $('#kkf',root).addEventListener('submit',e=>{e.preventDefault();const v=inp.value;inp.value='';add(v)});
  inp.addEventListener('paste',()=>setTimeout(()=>{if(/kick\.com\//i.test(inp.value)){const v=inp.value;inp.value='';add(v)}},30));
  list.addEventListener('click',e=>{

    if(x){const s=x.dataset.rm;chs=chs.filter(c=>c!==s);delete info[s];LS.set('pano.kick.ch',chs);if(cur===s)cur=null;drawList();if(!cur)idle();return}
    const b=e.target.closest('.kk-c');if(b)play(b.dataset.s);
  });
  drawList();idle();refresh();every(w,refresh,60e3);
  return{off(){cur=null;vid.innerHTML=''},on(){cur=null;drawList();idle();refresh()},dispose(){vid.innerHTML=''}};   /* görünmeyen sekmede yayın durur */
}

  /* Twitch'in herkese açık web sorgusu (gql.twitch.tv); tüm kanallar tek istekte sorulur. İstemci kimliği twitch.tv sayfasının kendi kimliğidir. */
  async function fetchAll(list){
    if(!list.length)return;
    try{
      const r=await fetch('https://gql.twitch.tv/gql',{method:'POST',headers:{'Client-Id':TW_CID},signal:AbortSignal.timeout(9000),
        body:JSON.stringify({query:'query($l:[String!]!){users(logins:$l){login displayName profileImageURL(width:70) stream{viewersCount title game{displayName}}}}',variables:{l:list}})});
      if(!r.ok)throw new Error(r.status);
      const j=await r.json(),us=j&&j.data&&j.data.users;if(!Array.isArray(us))throw new Error('bad');
      const by={};us.forEach(u=>{if(u&&u.login)by[u.login.toLowerCase()]=u});
      list.forEach(s=>{
        const u=by[s.toLowerCase()];
        if(!u){info[s]={nf:true};return}   /* böyle bir kanal yok */
        const l=u.stream;
        info[s]={name:String(u.displayName||u.login||s),pic:u.profileImageURL||'',live:!!l,viewers:l?(+l.viewersCount||0):0,title:l?String(l.title||''):'',cat:l&&l.game?String(l.game.displayName||''):''};
      });
    }catch{
      list.forEach(s=>{if(!info[s]||info[s].err)info[s]={name:s,err:true}});   /* geçici hata: varsa eski bilgi kalsın */
    }
  }
  async function refresh(){
    if(busy||!chs.length||root.hidden)return;
    busy=true;
    try{await fetchAll(chs)}finally{busy=false;loaded=true}
    drawList();if(!cur)idle();
  }
  function play(s){
    const i=info[s]||{};cur=s;drawList();
    if(i.nf){note('<b>'+esc(s)+'</b> adlı bir kanal bulunamadı.<br>Adı kontrol et ya da listeden çıkar.');return}
    if(!i.live&&!i.err){   /* durumu bilinmeyen kanalda yine de oynatıcı açılır; yayın varsa görünür */note('<b>'+esc(i.name||s)+'</b> şu an yayında değil.<br><a class="kk-open" href="https://twitch.tv/'+encodeURIComponent(s)+'" target="_blank" rel="noopener noreferrer">Twitch\'te aç</a>');return}
    if(!/^https?:$/.test(location.protocol)){note('Twitch oynatıcısı yalnızca bir web adresinden açılan sayfada çalışır.<br><a class="kk-open" href="https://www.twitch.tv/'+encodeURIComponent(s)+'" target="_blank" rel="noopener noreferrer">Twitch\'te aç</a>');return}
    vid.innerHTML='<iframe title="Twitch: '+esc(i.name||s)+'" src="https://player.twitch.tv/?channel='+encodeURIComponent(s)+'&parent='+encodeURIComponent(location.hostname)+'&autoplay=true" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  }
  async function add(text){
    const all=twitchSlugs(text);
    if(!all.length){flash('Geçerli bir kanal adı bulunamadı.');return}
    const fresh=all.filter(s=>!chs.includes(s));
    if(!fresh.length){flash('Bu kanal zaten listede.');return}
    if(chs.length+fresh.length>MAX){flash('En fazla '+MAX+' kanal eklenebilir.');return}
    flash('Kontrol ediliyor…');
    await fetchAll(fresh);
    const bad=fresh.filter(s=>info[s]&&info[s].nf);
    bad.forEach(s=>delete info[s]);
    chs=chs.concat(fresh.filter(s=>!bad.includes(s)));LS.set('pano.twitch.ch',chs);
    drawList();if(!cur)idle();
    flash(bad.length?'Bulunamadı: '+bad.join(', '):'Eklendi.');
  }
  $('#twf',root).addEventListener('submit',e=>{e.preventDefault();const v=inp.value;inp.value='';add(v)});
  inp.addEventListener('paste',()=>setTimeout(()=>{if(/twitch\.tv\//i.test(inp.value)){const v=inp.value;inp.value='';add(v)}},30));
  list.addEventListener('click',e=>{
    const x=e.target.closest('[data-rm]');
    if(x){const s=x.dataset.rm;chs=chs.filter(c=>c!==s);delete info[s];LS.set('pano.twitch.ch',chs);if(cur===s)cur=null;drawList();if(!cur)idle();return}
    const b=e.target.closest('.kk-c');if(b)play(b.dataset.s);
  });
  drawList();idle();refresh();every(w,refresh,60e3);
  return{off(){cur=null;vid.innerHTML=''},on(){cur=null;drawList();idle();refresh()},dispose(){vid.innerHTML=''}};   /* görünmeyen sekmede yayın durur */
}

/* ---------- TV İzle (M3U) ---------- */
function parseM3U(t){
  const out=[];let meta=null;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const a=k=>{const m=l.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''};
      const q=l.lastIndexOf('"'),c=l.indexOf(',',q<0?0:q);
      const name=(c>=0?l.slice(c+1).trim():'')||a('tvg-name')||'Kanal';
      meta={name,logo:a('tvg-logo'),group:a('group-title')};
    }else if(l[0]!=='#'){
      out.push({name:(meta&&meta.name)||l.split('/').pop().split('?')[0]||'Kanal',logo:meta?meta.logo:'',group:meta?meta.group:'',url:l});meta=null;
    }
  }
  return out;
}
/* hls.js tembel yükleme (SRI ile). Yalnızca HLS (.m3u8) kanalı ilk kez açılırken indirilir. */
let hlsP=null;
function loadHls(){
  if(window.Hls)return Promise.resolve(window.Hls);
  if(hlsP)return hlsP;
  hlsP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    s.integrity='sha384-w6Gb3fXHb5e1LUYa/hYA5Q41bEDglN5ZPCG7Jvnoo8/X90oGnlPqBlBJCe38mEMm';
    s.crossOrigin='anonymous';
    s.onload=()=>res(window.Hls);
    s.onerror=()=>{hlsP=null;rej(new Error('hls'))};
    document.head.appendChild(s);
  });
  return hlsP;
}

const fmt0=n=>n.toLocaleString('tr-TR',{maximumFractionDigits:0});
const CUR=[['USD','Amerikan Doları'],['EUR','Euro']];
let fxCache=null;
function getFX(force){
  if(!force&&fxCache&&Date.now()-fxCache.t<4*60e3)return fxCache.p;
  const p=(async()=>{
    const out={rates:{},gold:null,src:''};
    try{
      const s0=new Date(Date.now()-35*864e5).toISOString().slice(0,10);
      const j=await getJSON('https://api.frankfurter.dev/v1/'+s0+'..?base=TRY&symbols='+CUR.map(c=>c[0]).join(','));
      const days=Object.keys(j.rates).sort();
      CUR.forEach(c=>{const ser=days.map(d=>1/j.rates[d][c[0]]);const v=ser[ser.length-1],pv=ser[ser.length-2];out.rates[c[0]]={v,chg:pv?(v/pv-1)*100:null,ser:ser.slice(-24)}});
      out.src='Avrupa Merkez Bankası · '+new Date(days[days.length-1]+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
    }catch{}
    try{
      const e=await getJSON('https://open.er-api.com/v6/latest/USD');const tl=e.rates.TRY;
      if(!Object.keys(out.rates).length){CUR.forEach(c=>{out.rates[c[0]]={v:c[0]==='USD'?tl:tl/e.rates[c[0]],chg:null,ser:null}});out.src='ExchangeRate-API · anlık'}
      if(e.rates.XAU)out.gold=(tl/e.rates.XAU)/31.1035;
    }catch{}
    if(!out.gold&&out.rates.USD){try{const g=await getJSON('https://api.gold-api.com/price/XAU',7000);if(g&&g.price>0)out.gold=out.rates.USD.v*g.price/31.1035}catch{}}
    if(!Object.keys(out.rates).length)throw new Error('fx');
    return out;
  })();
  fxCache={t:Date.now(),p};p.catch(()=>{fxCache=null});return p;
}
function mountFX(w,root){
  root.innerHTML='<div class="fx">'+hd('fx','Döviz Kurları','<button class="ibtn" type="button" id="fxr" aria-label="Yenile">'+I.refresh+'</button>')+'<div class="fx-list noscroll" id="fxl"></div><div class="foot" id="fxf">Yükleniyor…</div></div>';
  const list=$('#fxl',root),foot=$('#fxf',root);
  const row=(fl,code,name,val,chg,series)=>'<div class="fx-r"><span class="fx-fl">'+fl+'</span><div class="fx-n"><b>'+code+'</b><span>'+name+'</span></div>'+(series?spark(series,chg>=0):'<span class="fx-sp"></span>')+'<div class="fx-v"><b>₺'+fmt2(val)+'</b>'+(chg==null?'':'<span class="'+(chg>=0?'up':'dn')+'">'+(chg>=0?'▲ +':'▼ ')+chg.toFixed(2)+'%</span>')+'</div></div>';
  const load=async force=>{
    try{
      const d=await getFX(force);
      const rows=CUR.map(c=>{const r=d.rates[c[0]];return row(FLAG[c[0]],c[0],c[1],r.v,r.chg,r.ser)});
      /* Tam altın: Cumhuriyet tam altını 7,216 g ve 22 ayar (0,916) = yaklaşık 6,61 g saf altın. Piyasadaki işçilik farkı dahil değildir. */
      if(d.gold){rows.push(row(FLAG.GRAM,'GRAM ALTIN','24 ayar · ons paritesinden',d.gold,null,null));rows.push(row(FLAG.TAM,'TAM ALTIN','Cumhuriyet · yaklaşık değer',d.gold*7.216*0.916,null,null))}
      list.innerHTML=rows.join('');foot.textContent=d.src;status('fx',true);
    }catch{list.innerHTML='<div class="nw-msg">Kurlar alınamadı.</div>';foot.textContent='';status('fx',false)}
  };
  $('#fxr',root).addEventListener('click',()=>load(true));load();every(w,load,5*60e3);onBus(w,'refresh',()=>load(true));
}

/* ---------- Üst çubuk: kurlar, kripto, gecikme, hava ---------- */
const TK={};const TK_ORDER=['USD','|','ETH'];   /* üst çubukta yalnızca bu çipler gösterilir */
const CRYPTO={};   /* üst çubuğun WebSocket/REST verisi; TradingView sekmeleri buradan okur */
const ico=svg=>'<span class="sb-ic">'+svg+'</span>';
let tkTimer=0;
function persistTk(){
  if(tkTimer)return;
  tkTimer=setTimeout(()=>{tkTimer=0;const o={};['USD','EUR','BTC','ETH','wx','ms'].forEach(k=>{if(TK[k])o[k]=TK[k]});LS.set('pano.tk',o)},4000);
}
const BOLT='<svg class="sb-bolt%C%" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2 4.5 13.6h6.1L9.6 22l9.9-12.2h-6.3z" fill="currentColor"/></svg>';
let lastRight='',lastChips='';
function setTk(k,o){TK[k]=o;if(k==='ms'||k==='wx')paintRight();else paintChips();persistTk()}
function paintTicker(){paintChips();paintRight()}
function paintChips(){
  const chip=o=>'<span class="sb-chip">'+o.icon+'<b>'+o.label+'</b><span class="sb-v">'+o.val+'</span>'+(o.chg==null||!isFinite(o.chg)?'':'<i class="'+(o.chg>=0?'up':'dn')+'">'+(o.chg>=0?'▲':'▼')+Math.abs(o.chg).toFixed(2)+'%</i>')+'</span>';
  const fxOn=TK.USD,crOn=TK.ETH;
  const have=TK_ORDER.filter(k=>k==='|'?(fxOn&&crOn):TK[k]);
  const html=have.length?have.map(k=>k==='|'?'<span class="sb-sep"></span>':chip(TK[k])).join(''):'<span class="sb-wait">Kurlar ve fiyatlar yükleniyor…</span>';
  if(html===lastChips)return;lastChips=html;
  $('#sbChips').innerHTML=html;
  syncTkSoon();
}
/* Ay evresi: ortalama sinodik ay (29,53 gün) ile hesaplanır, ağ gerekmez. */
function moonInfo(d=new Date()){
  const SYN=29.530588853,age=(((d-Date.UTC(2000,0,6,18,14))/864e5)%SYN+SYN)%SYN,ph=age/SYN,k=Math.cos(2*Math.PI*ph);
  const name=age<1.85?'Yeni Ay':age<5.54?'Büyüyen Hilal':age<9.22?'İlk Dördün':age<12.91?'Büyüyen Ay':age<16.61?'Dolunay':age<20.3?'Küçülen Ay':age<23.99?'Son Dördün':age<27.68?'Küçülen Hilal':'Yeni Ay';
  const wax=ph<.5,rx=+(6*Math.abs(k)).toFixed(2),s1=wax?1:0,s2=wax?(k>0?0:1):(k>0?1:0);
  const svg='<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="rgba(140,150,170,.35)"/><path d="M8 2A6 6 0 0 '+s1+' 8 14A'+rx+' 6 0 0 '+s2+' 8 2z" fill="#f4ecc2"/></svg>';
  return{name,pct:Math.round((1-k)/2*100),svg};
}
function paintRight(){
  const nm=esc(place.name.split(',')[0]);
  let r='<button type="button" class="sb-chip sb-btn" id="sbWx" aria-haspopup="dialog" aria-label="Konum: '+nm+'. Değiştirmek için tıkla">'+
    (TK.wx?'<span class="sb-ic wx">'+TK.wx.svg+'</span>':'<span class="sb-pin">'+I.pin+'</span>')+'<b>'+nm+'</b>'+(TK.wx?'<span class="sb-v">'+TK.wx.t+'°</span>':'')+(()=>{const m=moonInfo();return'<span class="sb-moon" title="Ay evresi: '+m.name+' · %'+m.pct+' aydınlık">'+m.svg+'</span>'})()+
    '<svg class="sb-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  /* Hava çipi ve ms çipi ayrı, kalıcı öğelerdir: ms çipi yeniden oluşturulmaz, açılan kutu ekranda kalır. */
  const box=$('#sbR');
  let wxBox=$('#sbWxBox',box),ms=$('#sbMs',box);
  if(!wxBox){box.innerHTML='<span id="sbWxBox" style="display:contents"></span><span class="sb-chip sb-ms" id="sbMs" tabindex="-1">'+BOLT.replace('%C%','')+'<b></b></span>';wxBox=$('#sbWxBox',box);ms=$('#sbMs',box)}
  if(r!==lastRight){lastRight=r;wxBox.innerHTML=r}
  const m=TK.ms?TK.ms.ms:undefined,ok=typeof m==='number',c=!ok?(m===null?' err':''):m<200?'':m<500?' warn':' err';
  $('.sb-bolt',ms).setAttribute('class','sb-bolt'+c);
  const bv=$('b',ms),vt=ok?String(m):'—';if(bv.textContent!==vt)bv.textContent=vt;
  ms.classList.toggle('off',!STREAM_LIVE);
  paintStatus();
}
function startTicker(){
  /* Önceki oturumdan kalan değerleri hemen göster, sonra canlı veriyle güncelle. */
  const cached=LS.get('pano.tk',null);
  if(cached)Object.keys(cached).forEach(k=>{if(TK_ORDER.includes(k)||k==='wx'||k==='ms')TK[k]=cached[k]});
  const fx=async force=>{try{const d=await getFX(force===true);['USD','EUR'].forEach(c=>{const r=d.rates[c];if(r)setTk(c,{label:c,icon:ico(FLAG[c]),val:'₺'+fmt2(r.v),chg:r.chg})})}catch{}};
  const px=v=>'$'+v.toLocaleString('en-US',{maximumFractionDigits:v<100?2:0});
  const apply=(sym,price,chg)=>{const k=sym.slice(0,3);if(COIN[k]&&isFinite(price)){CRYPTO[sym]={price,chg};setTk(k,{label:k,icon:ico(COIN[k]),val:px(price),chg})}};
  const qs=encodeURIComponent(JSON.stringify(['BTCUSDT','ETHUSDT']));
  /* Kaynakları aynı anda dene, ilk cevap vereni kullan. */
  const cr=async()=>{
    const srcs=[
      ...['https://data-api.binance.vision','https://api.binance.com'].map(b=>getJSON(b+'/api/v3/ticker/24hr?symbols='+qs,5000).then(j=>()=>j.forEach(t=>apply(t.symbol,+t.lastPrice,+t.priceChangePercent)))),
      getJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true',6000).then(g=>()=>{apply('BTCUSDT',g.bitcoin.usd,g.bitcoin.usd_24h_change);apply('ETHUSDT',g.ethereum.usd,g.ethereum.usd_24h_change)})
    ];
    try{const f=await Promise.any(srcs);f();status('cr',true)}catch{status('cr',false)}
  };
  /* Canlı akış: fiyatlar saniyede bir kendiliğinden güncellenir. */
  let ws=null,lastMsg=0;
  const wsLive=()=>!!ws&&ws.readyState===1&&Date.now()-lastMsg<20e3;
  const down=()=>{if(!ws)return;ws=null;if(STREAM_LIVE){STREAM_LIVE=false;paintRight()}setTimeout(openWS,6000)};
  const openWS=()=>{
    if(ws||!window.WebSocket)return;
    try{ws=new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@miniTicker/ethusdt@miniTicker')}catch{ws=null;return}
    lastMsg=Date.now();
    ws.onmessage=e=>{try{const d=JSON.parse(e.data).data;if(d&&d.s){lastMsg=Date.now();apply(d.s,+d.c,(+d.c/+d.o-1)*100);status('cr',true);if(!STREAM_LIVE){STREAM_LIVE=true;paintRight()}}}catch{}};
    ws.onclose=down;ws.onerror=down;
  };
  const reWS=()=>{if(ws){try{ws.onclose=null;ws.onerror=null;ws.close()}catch{}ws=null}openWS()};
  const wx=async()=>{try{const j=await getJSON('https://api.open-meteo.com/v1/forecast?latitude='+place.lat+'&longitude='+place.lon+'&current=temperature_2m,weather_code,is_day&timezone=auto');setTk('wx',{svg:wxIcon(j.current.weather_code,j.current.is_day),place:place.name.split(',')[0],t:Math.round(j.current.temperature_2m)})}catch{}};
  /* Gecikme: küçük bir ping isteği, anında sonuç verir. İlk ölçüm bağlantı kurulumunu da içerir, ikincisi gerçek değeri gösterir. */
  const ping=async()=>{
    /* Tek bir sunucuya bağlı kalmasın (Binance bazı ağlarda engelli): küçük, hızlı yanıt veren birkaç adresten
       ilk cevap vereni ölçülür. no-cors: içeriği okumuyoruz, yalnızca yanıt süresini ölçüyoruz. */
    const one=u=>{const t0=performance.now();const c=new AbortController(),to=setTimeout(()=>c.abort(),4000);
      return fetch(u,{mode:'no-cors',cache:'no-store',signal:c.signal}).then(()=>Math.max(1,Math.round(performance.now()-t0))).finally(()=>clearTimeout(to))};
    try{setTk('ms',{ms:await Promise.any(['https://www.gstatic.com/generate_204','https://1.1.1.1/cdn-cgi/trace','https://data-api.binance.vision/api/v3/ping'].map(one))})}
    catch{setTk('ms',{ms:null})}
  };
  paintTicker();ping();cr();openWS();fx();wx();setTimeout(ping,1200);
  setInterval(()=>{const l=wsLive();if(l!==STREAM_LIVE){STREAM_LIVE=l;paintRight()}},5e3);
  /* WebSocket canlıyken kripto için ayrıca yoklama yapılmaz; yalnızca akış koptuğunda REST'e düşer. */
  const vis=f=>()=>{if(!document.hidden)f()};   /* gizli sekmede ağ isteği yok; dönünce refreshAll zaten yeniler */
  setInterval(vis(ping),60e3);setInterval(vis(fx),5*60e3);setInterval(vis(()=>{if(!wsLive())cr()}),30e3);setInterval(vis(wx),10*60e3);bus.addEventListener('place',wx);
  bus.addEventListener('refresh',()=>{fx(true);wx();ping();if(!wsLive()){reWS();cr()}});
}
