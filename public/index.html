function mountDaily(w,root){
  const TABS=[['ayet','Ayet',AYET,'Günün Ayeti'],['hadis','Hadis',HADIS,'Günün Hadisi'],['esma','Esma',ESMA,'Günün Esması']];
  let tab=LS.get('pano.daily.tab','ayet');if(!TABS.find(t=>t[0]===tab))tab='ayet';
  const off={ayet:0,hadis:0,esma:0};
  /* Metin kutuya sığana kadar yazı boyutunu küçült (en küçük 10px). */
  const fit=()=>{
    const q=$('.dv-q',root);
    if(q){
      let lo=10,hi=28,best=10;
      while(hi-lo>.4){const m=(lo+hi)/2;q.style.fontSize=m+'px';if(q.scrollHeight<=q.clientHeight+1){best=m;lo=m}else hi=m}
      q.style.fontSize=best+'px';return;
    }
    const es=$('.es-n',root);
    if(es){
      const h=$('h3',es),p=$('p',es);let lo=10,hi=24,best=10;
      while(hi-lo>.4){const m=(lo+hi)/2;p.style.fontSize=m+'px';h.style.fontSize=(m*2.5)+'px';if(es.scrollHeight<=es.clientHeight+1){best=m;lo=m}else hi=m}
      p.style.fontSize=best+'px';h.style.fontSize=(best*2.5)+'px';
    }
  };
  const draw=()=>{
    const T=TABS.find(t=>t[0]===tab),items=T[2],n=items.length;
    const i=((dayOfYear()+off[tab])%n+n)%n,it=items[i];
    w.dataset.tab=tab;
    const tabs='<div class="dv-tabs" role="tablist">'+TABS.map(t=>'<button type="button" role="tab" aria-selected="'+(t[0]===tab)+'" class="'+(t[0]===tab?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
    const head='<div class="hd">'+logo(tab)+'<span class="ttl">'+T[3]+'</span><span class="sp"></span>'+tabs+'</div>';
    const nav='<button class="ibtn" type="button" data-d="-1" aria-label="Önceki">'+I.prev+'</button><button class="ibtn" type="button" data-d="1" aria-label="Sonraki">'+I.next+'</button>';
    const body=tab==='esma'
      ?'<div class="es-n"><h3>'+esc(it[0])+'</h3><p>'+esc(it[1])+'</p></div><div class="dv-f"><span class="es-c">'+(i+1)+' / '+n+'</span>'+nav+'</div>'
      :'<div class="dv-q noscroll"><span>“'+esc(it[0])+'”</span></div><div class="dv-f"><span class="dv-ref">'+esc(it[1])+'</span>'+nav+'</div>';
    root.innerHTML='<div class="dv">'+head+body+'</div>';
    fit();
  };
  /* Her 60 saniyede ayet → hadis → esma → ayet. Elle seçimde süre yeniden başlar. */
  let timer=0;const gen=w._gen;
  const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>{
    if(w._gen!==gen)return;   /* widget kaldırıldı */
    off.ayet=off.hadis=off.esma=0;
    tab=TABS[(TABS.findIndex(t=>t[0]===tab)+1)%TABS.length][0];
    draw();arm();
  },60e3)};
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;LS.set('pano.daily.tab',tab);draw();arm();return}
    const b=e.target.closest('[data-d]');if(b){off[tab]+=+b.dataset.d;draw();arm()}
  });
  draw();arm();
  new ResizeObserver(()=>requestAnimationFrame(fit)).observe(root);
  const redraw=()=>{if(!off.ayet&&!off.hadis&&!off.esma)draw()};
  every(w,redraw,3600e3);onBus(w,'refresh',redraw);
}

/* ---------- Yeni çıkacak oyunlar / film ve etkinlikler ---------- */
const KEYS={
 rawg:{name:'RAWG',url:'https://rawg.io/apidocs',why:'Tarihli oyun listesi için ücretsiz anahtar (ayda 20.000 istek). Sitede hesap açıp "Get API Key" ile alırsın.'},
 tmdb:{name:'TMDB',url:'https://www.themoviedb.org/settings/api',why:'Vizyona girecek filmler için ücretsiz anahtar. Hesap açıp e-postanı doğrula, API sayfasından kişisel kullanım için başvur. Kısa "API Anahtarı" ya da uzun "Erişim Belirteci" olur.'},
};
const getKey=k=>{const v=LS.get('pano.key.'+k,'');return typeof v==='string'?v:''};
const isoD=d=>d.toISOString().slice(0,10);
const addDays=n=>new Date(Date.now()+n*864e5);
function fmtD(d){
  const x=new Date(d+'T12:00');if(isNaN(x))return'';
  const same=x.getFullYear()===new Date().getFullYear();
  return x.toLocaleDateString('tr-TR',same?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'});
}
async function gamesRAWG(key){

  const items=(j.results||[]).filter(g=>g.background_image&&g.released&&g.released>=isoD(new Date())).sort((a,b)=>a.released<b.released?-1:a.released>b.released?1:0)
    .map(g=>({title:g.name,img:g.background_image.replace('/media/','/media/crop/600/400/'),date:g.released,sub:(g.platforms||[]).slice(0,3).map(p=>p.platform.name).join(' · '),url:'https://rawg.io/games/'+g.slug}));
  return{items,land:true,foot:'Veriler RAWG\'dan · önümüzdeki 12 ay, en çok beklenenler'};

/* Steam mağaza vitrini: tek istek, dört liste (yakında · yeni çıkanlar · çok satanlar · indirimler). 10 dk bellekte tutulur, sekmeler aynı isteği paylaşır. */
let _steamF=null;
function steamFeat(){
  if(_steamF&&Date.now()-_steamF.t<10*60e3)return _steamF.p;
  const u='https://store.steampowered.com/api/featuredcategories?cc=tr&l=turkish';
  /* Steam CORS izni vermez; dosyadan (file://) açıldığında istek "null" kaynaklı olur ve bazı vekiller reddeder.
     Bu yüzden doğrudan istek ve tüm vekiller aynı anda denenir; yalnızca geçerli Steam JSON'u dönen kazanır. */
  const asJSON=t=>{const j=JSON.parse(String(t).slice(String(t).indexOf('{'),String(t).lastIndexOf('}')+1));if(!j||typeof j!=='object'||!Object.values(j).some(v=>v&&Array.isArray(v.items)))throw new Error('steam');return j};
  const p=Promise.any([
    getText(u,9000),
    ...PROXIES.map(x=>getText(x(u),12000)),
    getText('https://r.jina.ai/'+u,15000)
  ].map(pr=>pr.then(asJSON))).then(j=>{
    /* Son başarılı vitrini tarayıcıda sakla: ağ/vekil çökerse eski liste gösterilir. */
    try{const keep={};for(const k of Object.keys(STEAM_SEC)){const it=(j[k]&&j[k].items)||[];keep[k]={items:it.slice(0,40).map(g=>({id:g.id,name:g.name,discounted:g.discounted,discount_percent:g.discount_percent,final_price:g.final_price,currency:g.currency,large_capsule_image:g.large_capsule_image,header_image:g.header_image,release_date:g.release_date}))}}
      LS.set('pano.steam.f',{t:Date.now(),j:keep})}catch(e){}
    return j;
  }).catch(e=>{
    console.warn('Steam listesi alınamadı',e&&e.errors);
    const c=LS.get('pano.steam.f',null);
    if(c&&c.j&&Date.now()-c.t<14*864e5)return Object.assign({},c.j,{_stale:c.t});
    const err=new Error('steam-ag');err.detail=((e&&e.errors)||[e]).map(x=>x&&x.message).filter(Boolean).slice(0,3).join(' · ');throw err;
  });
  _steamF={t:Date.now(),p};
  p.catch(()=>{if(_steamF&&_steamF.p===p)_steamF=null});
  return p;
}
const trPrice=(c,cur)=>{if(!(c>0))return'Ücretsiz';try{return(c/100).toLocaleString('tr-TR',{style:'currency',currency:cur||'TRY'})}catch(e){return''}};
const STEAM_SEC={
  coming_soon:{sub:()=>'Steam · Yakında',foot:'Steam "yakında" listesi · tarihli liste için RAWG anahtarı ekle'},
  new_releases:{sub:g=>'Steam · '+trPrice(g.final_price,g.currency),foot:'Steam · yeni çıkan oyunlar'},
  top_sellers:{sub:g=>'Steam · '+trPrice(g.final_price,g.currency),foot:'Steam · en çok satanlar'},
  specials:{sub:g=>'Steam · '+trPrice(g.final_price,g.currency),foot:'Steam · öne çıkan indirimler'}
};
async function gamesSteam(sec='coming_soon'){
  const j=await steamFeat(),S=STEAM_SEC[sec],list=(j[sec]&&j[sec].items)||[];
  const seen=new Set();
  const items=list.filter(g=>(g.large_capsule_image||g.header_image)&&!seen.has(g.id)&&seen.add(g.id)).map(g=>({title:g.name,img:'https://cdn.akamai.steamstatic.com/steam/apps/'+g.id+'/library_600x900.jpg',img2:g.large_capsule_image||g.header_image,
    date:sec==='coming_soon'&&typeof g.release_date==='number'&&g.release_date>0?isoD(new Date(g.release_date*1000)):'',
    badge:g.discounted&&g.discount_percent>0?'-%'+g.discount_percent:'',sub:S.sub(g),url:'https://store.steampowered.com/app/'+g.id}));
  if(!items.length)throw new Error('steam-bos');
  return{items,land:false,foot:S.foot,note:j._stale?'Çevrimdışı kopya ('+ago(new Date(j._stale).toISOString())+')':''};
}
/* İndirimler: CheapShark (anahtarsız, Steam puanı + Metacritic verir) ile Steam vitrinindeki indirim listesi aynı anda denenir; hangisi önce gelirse o gösterilir. */
async function gamesDeals(){
  const u='https://www.cheapshark.com/api/1.0/deals?storeID=1&onSale=1&sortBy=Deal%20Rating&steamRating=75&pageSize=40';
  const asJ=t=>{const j=JSON.parse(String(t).slice(String(t).indexOf('['),String(t).lastIndexOf(']')+1));if(!Array.isArray(j)||!j.length)throw new Error('cheapshark');return j};
  const cs=Promise.any([getText(u,9000),...PROXIES.map(p=>getText(p(u),12000))].map(pr=>pr.then(asJ))).then(j=>{
    const seen=new Set();
    const items=j.filter(d=>d.steamAppID&&d.title&&!seen.has(d.steamAppID)&&seen.add(d.steamAppID)).slice(0,36).map(d=>({
      title:d.title,img:'https://cdn.akamai.steamstatic.com/steam/apps/'+d.steamAppID+'/library_600x900.jpg',img2:'https://cdn.akamai.steamstatic.com/steam/apps/'+d.steamAppID+'/header.jpg',
      badge:'-%'+Math.round(+d.savings||0),
      sub:'$'+d.salePrice+(+d.metacriticScore>0?' · MC '+d.metacriticScore:'')+(+d.steamRatingPercent>0?' · %'+d.steamRatingPercent+' olumlu':''),
      url:'https://www.cheapshark.com/redirect?dealID='+encodeURIComponent(d.dealID)}));
    if(!items.length)throw new Error('cheapshark-bos');
    return{items,land:false,foot:'CheapShark · Steam indirimleri, fırsat puanına göre (fiyatlar USD)'};
  });
  /* CheapShark tercih edilir (puan + fırsat sırası); 3,5 sn içinde gelmezse ya da hata verirse Steam indirim listesi devreye girer. */
  return Promise.any([cs,new Promise(r=>setTimeout(r,3500)).then(()=>gamesSteam('specials'))]);
}
/* GOG "yakında" kataloğu: anahtarsız, dikey kapak verir. Steam ile aynı anda denenir, hangisi önce cevap verirse o gösterilir. */
async function gamesGOG(){
  const u='https://catalog.gog.com/v1/catalog?limit=48&order=asc:releaseDate&productType=in:game,pack&releaseStatus=in:upcoming&countryCode=TR&locale=tr-TR&currencyCode=TRY';
  const asJ=t=>{const j=JSON.parse(String(t).slice(String(t).indexOf('{'),String(t).lastIndexOf('}')+1));if(!j||!Array.isArray(j.products)||!j.products.length)throw new Error('gog');return j};
  const j=await Promise.any([getText(u,9000),...PROXIES.map(p=>getText(p(u),12000)),getText('https://r.jina.ai/'+u,15000)].map(pr=>pr.then(asJ)));
  const dt=x=>(String(x.releaseDate||'').replace(/\./g,'-').match(/^\d{4}-\d{2}-\d{2}/)||[''])[0];
  const items=j.products.filter(x=>x.title&&(x.coverVertical||x.coverHorizontal)).map(x=>({title:x.title,img:x.coverVertical||x.coverHorizontal,date:dt(x),sub:'GOG · Yakında',url:x.storeLink||('https://www.gog.com/game/'+x.slug)}))
    .sort((x,y)=>(x.date?0:1)-(y.date?0:1)||(x.date<y.date?-1:x.date>y.date?1:0));
  return{items,land:false,foot:'GOG "yakında" listesi · tarihli liste için RAWG anahtarı ekle'};
}
async function filmsTMDB(key){
  const long=key.length>60,hdr={headers:{Authorization:'Bearer '+key,accept:'application/json'}};
  const mk=p=>'https://api.themoviedb.org/3/discover/movie?language=tr-TR&region=TR&sort_by=popularity.desc&include_adult=false&with_release_type='+encodeURIComponent('2|3')+'&release_date.gte='+isoD(new Date())+'&release_date.lte='+isoD(addDays(150))+'&page='+p+(long?'':'&api_key='+encodeURIComponent(key));
  const pages=await Promise.all([1,2].map(p=>getJSON(mk(p),12000,long?hdr:undefined)));
  const seen=new Set();
  const items=pages.flatMap(j=>j.results||[]).filter(m=>m.poster_path&&m.release_date&&!seen.has(m.id)&&seen.add(m.id))
    .sort((a,b)=>a.release_date<b.release_date?-1:a.release_date>b.release_date?1:0).slice(0,36)
    .map(m=>({title:m.title,img:'https://image.tmdb.org/t/p/w342'+m.poster_path,date:m.release_date,sub:m.original_title&&m.original_title!==m.title?m.original_title:'',url:'https://www.themoviedb.org/movie/'+m.id}));
  return{items,land:false,foot:'Bu ürün TMDB API\'sini kullanır, TMDB tarafından onaylanmamıştır · önümüzdeki 5 ay'};
}
function mountCovers(w,root,cfg){
  let tab=cfg.tabs?LS.get('pano.cv.'+cfg.id,cfg.tabs[0][0]):'';
  if(cfg.tabs&&!cfg.tabs.find(t=>t[0]===tab))tab=cfg.tabs[0][0];
  let showKey=false,seq=0;const cache={};
  let items=[],land=false,page=0,pages=1,lastWheel=0;
  const tabsHtml=()=>cfg.tabs?'<div class="dv-tabs" role="tablist">'+cfg.tabs.map(t=>'<button type="button" role="tab" aria-selected="'+(t[0]===tab)+'" class="'+(t[0]===tab?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>':'';
  root.innerHTML='<div class="nw cvw"><div class="hd">'+logo(cfg.id)+'<span class="ttl">'+cfg.title+'</span><span class="sp"></span><span id="cvt" style="display:contents">'+tabsHtml()+'</span><button class="ibtn" type="button" data-a="key" title="API anahtarı" aria-label="API anahtarı">'+I.key+'</button><button class="ibtn" type="button" data-a="ref" aria-label="Yenile">'+I.refresh+'</button></div><div class="cvb" id="cvb"></div><div class="foot cvf"><span class="cvf-t" id="cvf"></span><span class="pg" id="cvpg" hidden></span></div></div>';
  const body=$('#cvb',root),foot=$('#cvf',root),pgEl=$('#cvpg',root);
  body.addEventListener('error',e=>{
    if(e.target.tagName!=='IMG')return;
    const f=e.target.dataset.fb;
    if(f&&!e.target.dataset.tried){e.target.dataset.tried=1;e.target.src=f}   /* dikey afiş yoksa yatay kapsüle düş */
    else e.target.style.visibility='hidden';
  },true);
  const card=x=>'<a class="cv-c" href="'+esc(safeUrl(x.url)||'#')+'" target="_blank" rel="noopener noreferrer"><div class="cv-img">'+(safeUrl(x.img)?'<img src="'+esc(safeUrl(x.img))+'"'+(safeUrl(x.img2)?' data-fb="'+esc(safeUrl(x.img2))+'"':'')+' alt="" loading="lazy" referrerpolicy="no-referrer">':'')+(x.date?'<span class="cv-date">'+fmtD(x.date)+'</span>':x.badge?'<span class="cv-date">'+esc(x.badge)+'</span>':'')+'</div><div class="cv-t">'+esc(x.title)+'</div>'+(x.sub?'<div class="cv-s">'+esc(x.sub)+'</div>':'')+'</a>';
  const setFoot=t=>{foot.textContent=t||''};
  const clear=()=>{items=[];pages=1;pgEl.hidden=true};
  /* Kutuya tam sığan satır kadar kart göster; yarım görünen kart olmasın. Kalanlar sonraki sayfada. */
  function applyPage(){
    const cv=$('.cv',body);
    if(!cv||!items.length){pgEl.hidden=true;return}
    const cards=[...cv.children];
    cards.forEach(c=>{c.hidden=false});
    const cs=getComputedStyle(cv);
    if(cs.display==='flex'){pages=1;pgEl.hidden=true;return}          /* XS: tek sıra, yatay kaydırma */
    cv.style.gridTemplateColumns='';cv.style.justifyContent='';cv.style.removeProperty('--ph');cv.classList.remove('cmp','nt');
    let cols=Math.max(1,cs.gridTemplateColumns.split(' ').length);const gapY=parseFloat(cs.rowGap)||0,gapX=parseFloat(cs.columnGap)||0;
    const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const cardH=Math.max(...cards.map(c=>c.offsetHeight));
    let rows=Math.floor((cv.clientHeight-pad+gapY)/(cardH+gapY));
    if(rows<1){
      /* Tek satır bile sığmıyorsa: afişi küçült, isim + alt başlık görünür kalsın. */
      rows=1;
      const ratio=cv.classList.contains('land')?1.6:2/3,avail=cv.clientHeight-pad-1;
      const W=cv.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
      const set=ph=>{
        const pw=Math.floor(ph*ratio);cols=Math.max(1,Math.floor((W+gapX)/(pw+gapX)));
        cv.classList.add('cmp');cv.style.setProperty('--ph',ph+'px');
        cv.style.gridTemplateColumns='repeat('+cols+','+pw+'px)';cv.style.justifyContent='space-between';
      };
      let ph=Math.floor(avail-(cardH-cards[0].querySelector('.cv-img').offsetHeight));
      set(Math.max(40,ph));
      for(let k=0;k<30&&ph>40&&cards[0].offsetHeight>avail;k++){ph-=3;set(ph)}   /* gerçek yüksekliğe göre ince ayar */
      if(ph<64||cards[0].offsetHeight>avail){cv.classList.add('nt');set(Math.max(40,Math.floor(avail)))}   /* çok kısa: yalnızca afişler */
    }
    const per=cols*rows;
    pages=Math.max(1,Math.ceil(cards.length/per));page=Math.min(page,pages-1);
    cards.forEach((c,i)=>{c.hidden=i<page*per||i>=(page+1)*per});
    pgEl.hidden=pages<=1;
    pgEl.innerHTML='<button type="button" class="pgb" data-a="pp" aria-label="Önceki sayfa">‹</button><span>'+(page+1)+'/'+pages+'</span><button type="button" class="pgb" data-a="pn" aria-label="Sonraki sayfa">›</button>';
  }
  new ResizeObserver(()=>requestAnimationFrame(applyPage)).observe(body);
  /* Otomatik sayfa geçişi (yalnızca cfg.autoPage true dönen sekmede): her 60 sn'de bir sonraki sayfa, sondan sonra başa döner.
     Elle sayfa değiştirilince (ok, tekerlek, sekme) süre yeniden başlar. */
  let apTimer=0;const apGen=w._gen;
  const arm=()=>{clearTimeout(apTimer);if(!cfg.autoPage)return;apTimer=setTimeout(()=>{
    if(w._gen!==apGen)return;   /* widget kaldırıldı */
    if(cfg.autoPage(tab)&&!showKey&&pages>1&&!document.hidden){page=(page+1)%pages;applyPage()}
    arm();
  },60e3)};
  body.addEventListener('wheel',e=>{
    if(pages<=1)return;
    const np=page+(e.deltaY>0?1:-1);if(np<0||np>=pages)return;
    e.preventDefault();
    if(performance.now()-lastWheel<280)return;
    lastWheel=performance.now();page=np;applyPage();arm();
  },{passive:false});
  const showResult=(r,reset)=>{
    items=r.items;land=!!r.land;if(reset)page=0;
    body.innerHTML='<div class="cv noscroll'+(land?' land':'')+'">'+items.map(card).join('')+'</div>';
    setFoot((r.note?r.note+' · ':'')+r.foot);applyPage();
  };
  const panel=(prov,key)=>{
    const K=KEYS[prov],opt=cfg.optional(tab);clear();
    body.innerHTML='<div class="kp"><b>'+K.name+' anahtarı'+(opt?' (isteğe bağlı)':' gerekli')+'</b><p>'+K.why+'</p><a href="'+K.url+'" target="_blank" rel="noopener noreferrer">Ücretsiz anahtar al ↗</a>'+
      '<form class="yt-in" data-k="'+prov+'"><input type="text" autocomplete="off" spellcheck="false" placeholder="Anahtarı yapıştır" aria-label="'+K.name+' anahtarı"><button class="yt-go" type="submit">Kaydet</button></form>'+
      (key?'<button type="button" class="kp-b" data-a="rm">Kayıtlı anahtarı sil</button>':'')+((key||opt)?'<button type="button" class="kp-b" data-a="close">Kapat</button>':'')+'</div>';
    setFoot('Anahtar yalnızca bu tarayıcıda saklanır.');
  };
  async function load(force){
    const my=++seq,prov=cfg.prov(tab),key=getKey(prov);
    if(showKey||(!key&&!cfg.optional(tab))){panel(prov,key);return}
    const ck=tab+'|'+(key?1:0),c=cache[ck];
    if(!force&&c&&Date.now()-c.t<30*60e3){showResult(c.r,false);return}
    clear();body.innerHTML='<div class="cv noscroll'+(cfg.landDefault(tab)?' land':'')+'">'+Array(6).fill('<div class="cv-c"><div class="cv-img sk"></div></div>').join('')+'</div>';setFoot('');
    try{
      const r=await cfg.src(tab,key);if(my!==seq)return;
      cache[ck]={t:Date.now(),r};
      if(!r.items.length){clear();body.innerHTML='<div class="nw-msg">Şu an listelenecek bir şey bulunamadı.</div>';setFoot(r.foot||'');return}
      showResult(r,true);
      if(cfg.status)status(cfg.status,true);
    }catch(e){
      if(my!==seq)return;clear();
      const bad=/^(401|403)$/.test(String(e&&e.message));
      body.innerHTML='<div class="nw-msg"><div>'+(bad?'API anahtarı kabul edilmedi.':'Liste şu an alınamadı.')+'</div>'+(()=>{const dt=e&&(e.detail||(e.errors||[]).map(x=>x&&(x.detail||x.message)).filter(Boolean).slice(0,3).join(' · '));return !bad&&dt?'<div style="font-size:11px;opacity:.6;margin:4px 0">'+esc(dt)+'</div>':''})()+'<button type="button" data-a="'+(bad?'key':'ref')+'">'+(bad?'Anahtarı değiştir':'Tekrar dene')+'</button>'+((!bad&&cfg.optional(tab)&&!key)?'<button type="button" data-a="key">Anahtar ekle</button>':'')+'</div>';
    }
  }
  root.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');
    if(t){tab=t.dataset.t;LS.set('pano.cv.'+cfg.id,tab);showKey=false;page=0;$('#cvt',root).innerHTML=tabsHtml();load();arm();return}
    const a=e.target.closest('[data-a]');if(!a)return;
    const k=a.dataset.a;
    if(k==='key'){showKey=!showKey;load()}
    else if(k==='ref'){showKey=false;load(true)}
    else if(k==='close'){showKey=false;load()}
    else if(k==='rm'){LS.set('pano.key.'+cfg.prov(tab),'');showKey=true;load()}
    else if(k==='pp'){page=Math.max(0,page-1);applyPage();arm()}
    else if(k==='pn'){page=Math.min(pages-1,page+1);applyPage();arm()}
  });
  root.addEventListener('submit',e=>{
    const f=e.target.closest('form[data-k]');if(!f)return;e.preventDefault();
    const v=f.querySelector('input').value.trim();

  const absorb=list=>{
    const now=Date.now();
    list.forEach(x=>{
      if(!x||!x.title)return;
      let t=x._t||Date.parse(x.date);if(!(t>0))t=now;t=Math.min(t,now);   /* ileri tarihli haber üste yapışmasın */
      const k=nk(x),e=pool.get(k);
      if(e){if(t<e._t)e._t=t}else pool.set(k,{title:x.title,link:x.link,source:x.source,_t:t});
    });
  };
  const view=()=>{
    const lim=Date.now()-MAXAGE;
    for(const [k,x] of pool)if(x._t<lim)pool.delete(k);
    const arr=[...pool.values()].sort((a,b)=>b._t-a._t).map(x=>({...x,date:new Date(x._t).toISOString()}));
    return mergeSD([arr]);
  };
  const cached=LS.get(KEY,null);
  let cachedAt=0;
  if(cached&&Array.isArray(cached.it)){absorb(cached.it);cachedAt=cached.t||0}
  let seq=0,shown=false,lastAt=0;
  async function load(force){
    lastAt=Date.now();const my=++seq;shown=false;let fresh=false;
    btn.firstElementChild.classList.add('spin');
    if(force===true)SD_KEYS.forEach(k=>delete feedCache[k]);
    if(pool.size){const it=view();if(it.length){it.stale=cachedAt;show(it);shown=true}}else skel();
    try{
      await sdItems(part=>{if(my!==seq)return;absorb(part);fresh=true;const it=view();if(it.length){show(it);shown=true}});
      if(my!==seq)return;
      const it=view();cachedAt=Date.now();
      LS.set(KEY,{t:cachedAt,it:it.map(x=>({title:x.title,link:x.link,source:x.source,_t:x._t}))});
      show(it);status('gn',true);
    }catch{
      if(my!==seq)return;
      if(!shown)fail();
      status('gn',false);
    }
    btn.firstElementChild.classList.remove('spin');
  }
  btn.addEventListener('click',()=>load(true));
  load();every(w,()=>{if(!root.hidden)load()},150e3);onBus(w,'refresh',()=>{if(!root.hidden)load()});
  return{off(){},on(){if(Date.now()-lastAt>60e3)load()}};
}

   rss2json (CORS izinli, JSON döner), olmazsa herkese açık CORS vekilleri denenir. */

TECH_FEEDS.eko_bht={name:'Bloomberg HT',urls:['https://www.bloomberght.com/rss']};

const ECO_KEYS=['eko_bht','eko_aa','eko_cnn','eko_ntv','eko_ht'];
/* [sekme, ad, okunacak beslemeler, yalnızca bu sekmeye ait (tüm haberleri gösterilen) beslemeler] */
const TECH_TABS=[

  ['oyun','Oyun',['merlin','shiftdelete','donanim','webtekno'],['merlin']],

];
/* Karma beslemelerdeki (ShiftDelete, DonanımHaber, Webtekno) haberler kategori ve başlığa göre sekmelere dağıtılır. */
const RE_OYUN=/oyun|playstation|\bps[345]\b|xbox|nintendo|\bsteam\b|game pass|\bgta\b|fortnite|epic games|valorant|e-?spor|gamescom/i;
const RE_OTO=/otomobil|otomotiv|elektrikli ara[çc]|\btogg\b|\bsuv\b|sedan|hibrit|tesla|ferrari|porsche|lamborghini|formula 1|\bf1\b/i;
function techKind(x){
  const t=(x.cats||[]).join(' ')+' '+x.title;
  if(RE_OYUN.test(t))return'oyun';
  if(RE_OTO.test(t))return'oto';
  return'tekno';
}
const feedCache={};
const decHTML=s=>{const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value.replace(/\s+/g,' ').trim()};
function getFeed(key,ttl=10*60e3,proxyFirst=false){
  const f=TECH_FEEDS[key],c=feedCache[key];
  if(c&&Date.now()-c.t<ttl)return c.p;
  const iso=s=>{const m=String(s||'').match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})$/);return m?m[1]+'T'+m[2]+'Z':s};   /* rss2json saati UTC verir */
  const viaR2J=async url=>{
    const j=await getJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url),11000);
    if(j.status!=='ok'||!Array.isArray(j.items)||!j.items.length)throw new Error('rss2json');
    return j.items.map(i=>({title:decHTML(i.title),link:i.link,date:iso(i.pubDate),cats:(i.categories||[]).map(decHTML)}));
  };
  const viaPx=async url=>{const it=await viaProxy(url,t=>{const a=parseRSS(t);if(!a.length)throw new Error('boş');return a});return it.map(i=>({title:decHTML(i.title),link:i.link,date:i.date,cats:[]}))};
  const one=async url=>{
    /* Son dakikada rss2json önbelleği eski kalabildiği için önce vekiller denenir */
    if(proxyFirst)return Promise.any([viaPx(url),viaR2J(url)]);   /* hızlı mod: ikisi aynı anda, ilk dolu cevap kazanır */
    try{return await viaR2J(url)}catch{return await viaPx(url)}
  };
  const p=(async()=>{
    let items,err;
    const urls=f.urls||[f.url];
    if(proxyFirst){try{items=await Promise.any(urls.map(one))}catch(e){err=e}}   /* adresler de paralel */
    else for(const url of urls){try{items=await one(url);if(items&&items.length)break}catch(e){err=e}}
    if(!items||!items.length)throw err||new Error('besleme yok');
    return items.filter(x=>x.title&&safeUrl(x.link)).map(x=>({...x,source:f.name}));
  })();
  feedCache[key]={t:Date.now(),p};p.catch(()=>{delete feedCache[key]});return p;
}
function mergeSD(lists){
  const keys=[],out=[];
  lists.flat().sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0)).forEach(x=>{
    const key=x.title.toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöç]/g,'');
    if(keys.some(k=>k===key||(Math.min(k.length,key.length)>=25&&(k.startsWith(key)||key.startsWith(k)))))return;
    keys.push(key);out.push(x);
  });
  return out.slice(0,40);
}
/* Kaynaklar geldikçe onPart çağrılır: ilk gelen hemen görünür, en yavaşı beklenmez. */
async function sdItems(onPart,keys=SD_KEYS){
  const got={};
  const res=await Promise.allSettled(keys.map(k=>getFeed(k,90e3,true).then(it=>{got[k]=it.slice(0,15);if(onPart)onPart(mergeSD(Object.values(got)))})));
  if(!Object.keys(got).length)throw new Error('besleme yok');
  return mergeSD(Object.values(got));
}
async function techItems(tab){
  const T=TECH_TABS.find(t=>t[0]===tab);
  const res=await Promise.allSettled(T[2].map(async k=>({k,items:await getFeed(k,10*60e3,k.startsWith('eko_'))})));
  const ok=res.filter(r=>r.status==='fulfilled').map(r=>r.value);
  if(!ok.length)throw new Error('besleme yok');
  /* Aynı haber farklı sitelerde biraz farklı başlıkla çıkabilir: biri diğerinin başlangıcıysa tekrar sayılır. */
  const keys=[],out=[];
  ok.flatMap(({k,items})=>items.filter(x=>T[3].includes(k)||techKind(x)===tab))
    .sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0))
    .forEach(x=>{
      const key=x.title.toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöç]/g,'');
      if(keys.some(k=>k===key||(Math.min(k.length,key.length)>=25&&(k.startsWith(key)||key.startsWith(k)))))return;
      keys.push(key);out.push(x);
    });
  if(!out.length)throw new Error('boş');
  return out.slice(0,40);
}

  const nk=x=>x.title.toLocaleLowerCase('tr').replace(/[^a-z0-9ğüşıöç]/g,'').slice(0,70);

  const absorb=(m,list)=>{

    }
  }
  tt.innerHTML=tabsHtml();
  /* Her 60 saniyede teknoloji → oyun → otomobil → teknoloji. Elle seçimde süre yeniden başlar. */

/* Haber widget'ıyla aynı beslemeleri (feedCache) kullanır; ek ağ isteği yapmaz. Her kategoriden sırayla birer haber alınır. */
function startNewsTicker(){
  const el=$('#tk');if(!el)return;
  const TAG={tekno:['TEKNO','#0a84ff'],oyun:['OYUN','#8b5cf6'],oto:['OTO','#f97316'],eko:['EKO','#16a34a']};
  const item=x=>'<a class="tk-i" data-rd="1" href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer"><span class="tk-tag" style="background:'+TAG[x.kind][1]+'">'+TAG[x.kind][0]+'</span><span>'+esc(x.title)+'</span><span class="tk-src">'+esc(x.source||'')+'</span></a>';
  const paint=items=>{
    if(!items||!items.length){el.hidden=true;syncTkSoon();return}
    const g=items.map(item).join('');
    el.innerHTML='<div class="tk-track"><div class="tk-grp">'+g+'</div><div class="tk-grp" aria-hidden="true">'+g.replace(/<a /g,'<a tabindex="-1" ')+'</div></div>';
    el.hidden=false;syncTkSoon();
    /* Hız sabit (~30 px/sn): süre, tek grubun genişliğinden hesaplanır. */
    requestAnimationFrame(()=>{const gw=$('.tk-grp',el);if(gw)el.style.setProperty('--dur',Math.max(60,gw.getBoundingClientRect().width/30).toFixed(0)+'s')});
  };
  /* Tıklanan haber odakta kalıp şeridi durdurmasın: tıklamadan sonra odağı bırak. */
  el.addEventListener('click',e=>{const a=e.target.closest('a');if(a)setTimeout(()=>a.blur(),0)});
  const cached=LS.get('pano.news.strip',null);
  if(cached&&Array.isArray(cached.items))paint(cached.items);
  let busy=false;
  const load=async force=>{
    if(busy)return;busy=true;
    try{
      const ST=TECH_TABS;   /* Teknoloji · Oyun · Otomobil · Ekonomi */
      if(force===true)ST.forEach(t=>t[2].forEach(k=>delete feedCache[k]));
      const res=await Promise.allSettled(ST.map(async t=>({k:t[0],items:await techItems(t[0])})));
      const ok=res.filter(r=>r.status==='fulfilled').map(r=>r.value);
      if(!ok.length)return;   /* eski şerit kalsın */
      const seen=new Set(),out=[];
      for(let i=0;i<10;i++)ok.forEach(({k,items})=>{const x=items[i];if(x&&!seen.has(x.link)){seen.add(x.link);out.push({title:x.title,link:x.link,source:x.source,kind:k})}});
      /* Sıra tamamen karışık: kategori ve tarih sırası gözetilmez (Fisher-Yates). */
      for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
      if(out.length){LS.set('pano.news.strip',{t:Date.now(),items:out});paint(out)}
    }catch{}finally{busy=false}
  };
  load();setInterval(load,15*60e3);bus.addEventListener('refresh',()=>load());
}

/* r.jina.ai: t.me sayfasını HTML olarak döndüren, CORS izni olan okuyucu. Genel proxy'ler çoğu ağda zaman aşımına uğradığı için ilk bu denenir. */
function tgWhy(e){
  const m=String(e&&e.message||e||'');
  if(e&&e.name==='AbortError')return'zaman aşımı';
  if(/^\d{3}$/.test(m))return'HTTP '+m;
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return'ağ/CORS engeli';
  if(/All promises were rejected|AggregateError/i.test(m)||(e&&e.name==='AggregateError'))return'hepsi başarısız (zaman aşımı/engel)';
  if(m==='tg')return'sayfada mesaj yok (önizleme kapalı olabilir)';
  return m.slice(0,40);
}
async function jinaHtml(u){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch('https://r.jina.ai/'+u,{signal:c.signal,headers:{'X-Return-Format':'html'}});if(!r.ok)throw new Error(r.status);return await r.text()}
  finally{clearTimeout(to)}
}
async function tgFetch(c){
  /* Yollar aynı anda yarışır, ilk geçerli yanıt kullanılır: kendi sunucu fonksiyonu (varsa), jina, genel proxy'ler. */
  const u='https://t.me/s/'+c.u,ok=x=>{if(!/data-post="[^"]+\/\d+"/.test(x))throw new Error('tg');return x};   /* gerçekten mesaj içeren sayfa değilse kabul etme */
  const lab=(name,p)=>p.catch(e=>{throw new Error(name+': '+tgWhy(e))});   /* hata sebebi ekranda görünsün */
  const routes=[lab('jina',jinaHtml(u).then(ok)),lab('proxy',viaProxy(u,ok))];
  let t;
  try{t=await Promise.any(routes)}
  catch(e){const err=new Error('tg');err.detail=(e.errors||[e]).map(x=>String(x&&x.message||x)).join(' · ');throw err}
  const d=new DOMParser().parseFromString(t,'text/html');
  const items=[...d.querySelectorAll('.tgme_widget_message[data-post]')].map(m=>{
    const post=m.getAttribute('data-post')||'';
    if(!/^\w+\/\d+$/.test(post))return null;
    const te=m.querySelector('.tgme_widget_message_text.js-message_text');
    let txt='';
    if(te){const cl=te.cloneNode(true);cl.querySelectorAll('br').forEach(b=>b.replaceWith(' '));txt=cl.textContent.replace(/\s+/g,' ').trim()}
    if(!txt)txt='Medya mesajı';
    /* Mesaj içindeki ilk dış bağlantı (t.me / telegram bağlantıları hariç): alışveriş kategorisinde doğrudan ürüne gider. */
    let ext='';
    if(te)for(const a of te.querySelectorAll('a[href]')){
      const h=safeUrl(a.getAttribute('href'));if(!h)continue;
      let host='';try{host=new URL(h).hostname}catch{continue}
      if(/(^|\.)(t\.me|telegram\.(me|org)|telegra\.ph)$/i.test(host))continue;
      ext=h;break;
    }
    /* Mesajın ilk görseli: fotoğraf, video kapağı ya da bağlantı önizlemesi. */
    let img='';
    for(const n of m.querySelectorAll('.tgme_widget_message_photo_wrap,.tgme_widget_message_video_thumb,.link_preview_image,.link_preview_right_image')){
      const mm=(n.getAttribute('style')||'').match(/url\(\s*['"]?([^'")]+)/);if(mm&&/^https:\/\//.test(mm[1])){img=mm[1];break}
    }
    const tm=m.querySelector('.tgme_widget_message_date time');
    return{title:txt.slice(0,400),link:'https://t.me/'+post,ext,img,cat:c.cat,date:tm?tm.getAttribute('datetime'):'',source:c.name,ch:c.k};
  }).filter(x=>x&&safeUrl(x.link));
  if(!items.length){const err=new Error('tg');err.detail=c.name+': 0 mesaj ayrıştırıldı';throw err}   /* boş sonuç başarı sayılmasın, eski veriyi ezmesin */
  return items;
}
/* Yeni çekim eski listeyle birleşir (bağlantıya göre tekilleştirilir, gönderi numarasına göre yeniden eskiye sıralanır).
   Servisin önbelleğinden gelen eski bir kopya, daha önce görülmüş yeni haberleri listeden düşüremez. */
function tgUnion(old,nw){
  const m=new Map();
  [...(old||[]),...nw].forEach(x=>{if(x&&x.link)m.set(x.link,x)});
  const id=x=>+(String(x.link).match(/\/(\d+)$/)||[0,0])[1];
  return[...m.values()].sort((a,b)=>id(b)-id(a)).slice(0,40);
}
/* GitHub Actions'ın 5 dakikada bir hazırladığı hazır akış (kanal listesi dahil). Ulaşılamazsa canlı çekime (jina/proxy) düşülür.
   İki adres aynı anda okunur, daha yeni olan kullanılır: raw.githubusercontent.com bazen 5-8 dk eski kopya verir, GitHub API ise git deposundan okuduğu için günceldir
   (API anahtarsız saatte 60 istek sınırlıdır; tarayıcı önbelleği ve ETag sayesinde bu kullanım sınırı aşmaz, sınır dolarsa raw adresi devam eder). */
const TG_FEED='https://raw.githubusercontent.com/alibeypremium/alibaba-terminal/veri/tg.json';
const TG_API='https://api.github.com/repos/alibeypremium/alibaba-terminal/contents/tg.json?ref=veri';
async function tgFeed(){
  const one=async(url,opt)=>{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);
    try{
      const r=await fetch(url,{signal:c.signal,...opt});
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      if(!j||!Array.isArray(j.ch)||!j.t)throw new Error('feed');
      return j;
    }finally{clearTimeout(to)}
  };
  try{
    const got=(await Promise.allSettled([
      one(TG_API,{headers:{Accept:'application/vnd.github.raw+json'}}),
      one(TG_FEED+'?m='+Math.floor(Date.now()/60000),{cache:'no-store'})
    ])).filter(x=>x.status==='fulfilled').map(x=>x.value);
    if(!got.length)return null;
    const j=got.reduce((a,b)=>+b.t>+a.t?b:a);
    const map={};j.ch.forEach(x=>{if(x&&x.k&&Array.isArray(x.items))map[x.k]=x.items});
    return{t:+j.t,cfg:j.cfg,map};
  }catch{return null}
}
/* Geçici hatada (jina/proxy ara sıra boş ya da hatalı döner) bir kez daha dener. */
async function tgFetchRetry(c){try{return await tgFetch(c)}catch{await new Promise(r=>setTimeout(r,1500));return tgFetch(c)}}
function mountTelegram(w,root,tabs){
  let TABS;const mkTabs=()=>{TABS=[['all','Tümü'],...TG_CATS.filter(c=>TG_CH.some(h=>h.cat===c[0]))]};mkTabs();
  let tab=LS.get('pano.tg.tab',TABS[0][0]);if(!TABS.find(t=>t[0]===tab))tab=TABS[0][0];
  const data=LS.get('pano.tg.c',{})||{};const ts=LS.get('pano.tg.ts',{})||{},legacy=LS.get('pano.tg.t',0);let bad=[];   /* ts: kanal başına son başarılı çekim zamanı */
  const tabsHtml=()=>'<div class="dv-tabs ctabs" role="tablist">'+TABS.map(t=>'<button type="button" role="tab" aria-selected="'+(t[0]===tab)+'" class="'+(t[0]===tab?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  root.innerHTML='<div class="nw">'+hd('telegram','Telegram',(tabs||'')+'<button class="ibtn" type="button" id="tgr" aria-label="Yenile">'+I.refresh+'</button>')+'<div class="tg-sub" id="tgt"></div><div class="nw-list noscroll" id="tgl"></div><div class="foot" id="tgf"></div></div>';
  const list=$('#tgl',root),foot=$('#tgf',root),btn=$('#tgr',root),tt=$('#tgt',root);
  let seq=0,lastAt=0,lastLive=0,busy=false,why='';   /* busy: bir çekim sürerken true */
  const skel=()=>{list.innerHTML='<div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel"></div><div class="skel" style="width:70%"></div>'};
  const view=()=>mergeSD(TG_CH.filter(c=>tab==='all'||c.cat===tab).map(c=>data[c.k]||[]));
  /* Alt satır: verinin en son ne zaman çekildiği, en yeni mesajın ne kadar önce atıldığı ve alınamayan kanal sayısı. */
  const paintFoot=()=>{
    const chs=TG_CH.filter(c=>tab==='all'||c.cat===tab);
    const last=Math.max(0,...chs.map(c=>ts[c.k]||(data[c.k]?legacy:0)));
    let t=last?'Son Akış '+hms(last)+(Date.now()-last>25*60e3?' (eski)':''):'Henüz çekilmedi';
    const nb=chs.filter(c=>bad.includes(c.k)).length;if(nb)t+=' · '+nb+' kanal alınamadı';
    foot.textContent=t;
  };
  const show=()=>{
    const it=view();
    if(!it.length)return false;
    list.innerHTML=it.map(x=>{const d=TG_DIRECT.includes(x.cat)&&safeUrl(x.ext);const im=safeUrl(x.img);return'<a class="nw-i"'+(im?' data-img="'+esc(im)+'"':'')+(d?'':x.ext?' data-rd="1" data-rd-url="'+esc(safeUrl(x.ext))+'"':' data-rd="msg"')+' href="'+esc(d?safeUrl(x.ext):safeUrl(x.link))+'" target="_blank" rel="noopener noreferrer"><b>'+esc(x.title)+'</b><span>'+esc([x.source,ago(x.date)].filter(Boolean).join(' · ')+(d?' · ürüne git ↗':''))+'</span>'+'</a>'}).join('');
    paintFoot();
    return true;
  };
  const fail=()=>{list.innerHTML='<div class="nw-msg"><div>Bu sekmede şu an mesaj yok ya da alınamadı.<br><span style="font-size:11px;opacity:.7">Kanal herkese açık olmayabilir ya da servis yanıt vermedi.</span>'+'<br><span style="font-size:10.5px;opacity:.75;word-break:break-word">Ayrıntı: '+esc(why||'(hata kaydı yok)')+' · sürüm tg-0511g</span></div><button type="button" id="tgrt">Tekrar dene</button></div>';foot.textContent='';$('#tgrt',list).onclick=()=>load(true)};
  /* Seçili sekmede gösterilecek mesaj yoksa: çekim sürüyorsa iskelet, bittiyse mesaj + "Tekrar dene" (iskelet sonsuza kadar kalmasın). */
  const empty=()=>{if(busy)skel();else fail()};
  async function load(force){
    lastAt=Date.now();busy=true;const my=++seq;let ok=0;
    btn.firstElementChild.classList.add('spin');
    if(!show())skel();
    const feed=await tgFeed();
    if(my!==seq)return;
    /* Kanal/kategori listesi akıştan gelir (tek yerden yönetilir); değiştiyse sekmeler yeniden çizilir. */
    const cf=feed&&feed.cfg;
    if(cf&&Array.isArray(cf.ch)&&cf.ch.length&&Array.isArray(cf.cats)&&JSON.stringify([cf.cats,cf.ch])!==JSON.stringify([TG_CATS,TG_CH.map(({k,u,name,cat})=>({k,u,name,cat}))])){
      TG_CATS.splice(0,TG_CATS.length,...cf.cats);TG_CH.splice(0,TG_CH.length,...cf.ch);
      if(Array.isArray(cf.direct))TG_DIRECT.splice(0,TG_DIRECT.length,...cf.direct);
      mkTabs();if(!TABS.find(t=>t[0]===tab))tab=TABS[0][0];tt.innerHTML=tabsHtml();
      if(!show())skel();
    }
    /* Hazır akış (tg.json) her dakika kontrol edilir; ucuz bir dosyadır. Canlı çekim (jina/proxy) yalnızca elle yenilemede ya da akış alınamıyor/15 dk'dan eskiyse ve son denemeden 5 dk geçmişse yapılır. */
    const stale=!feed||Date.now()-feed.t>=15*60e3;
    const live=force===true||(stale&&Date.now()-lastLive>=5*60e3);
    if(!live&&!feed){busy=false;btn.firstElementChild.classList.remove('spin');return}   /* akış alınamadı, canlı çekim için erken: eldeki veriyle kal */
    if(live)lastLive=Date.now();
    const fresh=!live;
    const pull=async c=>{
      const f=feed&&feed.map[c.k];
      if(fresh){if(f&&f.length)return{items:f,t:feed.t};throw new Error('akışta yok')}
      try{return{items:await tgFetchRetry(c),t:Date.now()}}
      catch(e){if(f&&f.length)return{items:f,t:feed.t};throw e}
    };
    const res=await Promise.allSettled(TG_CH.map(c=>pull(c).then(r=>{
      if(my!==seq)return;ok++;data[c.k]=tgUnion(data[c.k],r.items);ts[c.k]=r.t;
      show();
    })));
    if(my!==seq)return;
    bad=TG_CH.filter((c,i)=>res[i].status==='rejected').map(c=>c.k);
    const rj=res.find(x=>x.status==='rejected');why=rj&&rj.reason&&rj.reason.detail||'';
    if(ok){LS.set('pano.tg.c',data);LS.set('pano.tg.ts',ts);status('tg',true)}
    else status('tg',false);
    busy=false;
    if(!show())fail();   /* hiç mesaj yoksa (ya da seçili sekmenin kanalları gelmediyse) boş ekran yerine mesaj göster */
    btn.firstElementChild.classList.remove('spin');
  }
  tt.innerHTML=tabsHtml();
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-t]');if(!b)return;
    tab=b.dataset.t;LS.set('pano.tg.tab',tab);tt.innerHTML=tabsHtml();
    if(!show())empty();
    list.scrollTop=0;   /* yeni sekme en üstteki haberden başlasın */
  });
  btn.addEventListener('click',()=>load(true));
  every(w,()=>{if(!root.hidden&&list.querySelector('.nw-i'))paintFoot()},30e3);   /* "x dk önce" ve "eski" bilgisi kendiliğinden güncellensin */
  load();every(w,()=>{if(!root.hidden)load()},60e3);   /* 1 dk: yalnızca hazır akış dosyası okunur (ucuz); GitHub 5 dk'da bir güncellediği için yeni veri en geç ~1 dk içinde görünür */onBus(w,'refresh',()=>{if(!root.hidden)load()});
  return{off(){},on(){if(Date.now()-lastAt>60e3)load()}};
}

/* ---------- Yedekle ve aktar: ayarlar tarayıcıda (localStorage) durduğu için başka cihaza ya da adrese taşımak için dosyaya yazılır ---------- */
const BK_OK=/^pano\.[\w.-]{1,80}$/;
const BK_SKIP=/^pano\.(news\.(c\.|strip$)|tech\.c\.|tg\.(c|ts|t)$|rd\.c$|radio\.ch3$|tk$|wx$|prayer$|steam\.f$|fb\.|x\.)/;   /* önbellekler: yeniden indirilir, yedeğe girmez */
function bkCollect(withKeys){
  const o={};
  try{for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!BK_OK.test(k)||BK_SKIP.test(k)||(!withKeys&&k.startsWith('pano.key.')))continue;
    const v=localStorage.getItem(k);if(v!=null)o[k]=v;
  }}catch{}
  return o;
}
/* Yedek dosyası güvenilmeyen veridir: yalnızca pano.* anahtarları, geçerli JSON metin değerleri ve boyut sınırı kabul edilir. */
function bkParse(text){
  let j;try{j=JSON.parse(text)}catch{return{err:'Bu dosya geçerli bir yedek değil.'}}
  if(!j||j.app!=='alibaba-terminal'||!j.data||typeof j.data!=='object'||Array.isArray(j.data))return{err:'Bu dosya AliBaba Terminal yedeği değil.'};
  const out={};let n=0;
  for(const [k,v] of Object.entries(j.data)){
    if(!BK_OK.test(k)||BK_SKIP.test(k)||typeof v!=='string'||v.length>1.5e6)continue;
    try{JSON.parse(v)}catch{continue}
    out[k]=v;n++;
  }
  return n?{data:out,n,keys:Object.keys(out).some(k=>k.startsWith('pano.key.'))}:{err:'Yedekte alınabilecek ayar bulunamadı.'};
}
function openBackup(){
  if($('.bk-ov'))return;
  const prev=document.activeElement;
  const ov=document.createElement('div');ov.className='bk-ov';
  ov.innerHTML='<div class="bk" role="dialog" aria-modal="true" aria-labelledby="bkT"><h3 id="bkT">Yedekle ve aktar</h3>'+
    '<p>Notların, kanal listelerin, ayarların ve yerleşimin tek bir dosyaya yazılır. Başka bir cihaza ya da yeni bir adrese taşımak için kullanılır.</p>'+
    '<label class="bk-ck"><input type="checkbox" id="bkKeys"><span>API anahtarlarını da ekle. Dosyayı o zaman gizli tut.</span></label>'+
    '<div class="bk-row"><button type="button" class="bk-b on" id="bkDl">Yedeği indir</button><button type="button" class="bk-b" id="bkUp">Yedeği yükle</button></div>'+
    '<input type="file" id="bkFile" accept=".json,application/json" hidden>'+
    '<div class="bk-msg" id="bkMsg" role="status" aria-live="polite"></div>'+
    '<div class="bk-row"><button type="button" class="bk-b on" id="bkApply" hidden>Bu yedeği uygula</button><button type="button" class="bk-b" id="bkX">Kapat</button></div></div>';
  document.body.appendChild(ov);
  const $b=s=>$(s,ov),msg=$b('#bkMsg'),apply=$b('#bkApply'),file=$b('#bkFile');
  let pending=null;
  const close=()=>{document.removeEventListener('keydown',onKey,true);ov.remove();if(prev&&prev.focus)try{prev.focus()}catch{}};
  const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
  document.addEventListener('keydown',onKey,true);
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  $b('#bkX').addEventListener('click',close);
  $b('#bkDl').addEventListener('click',()=>{
    const data=bkCollect($b('#bkKeys').checked),n=Object.keys(data).length;
    const blob=new Blob([JSON.stringify({app:'alibaba-terminal',v:1,t:new Date().toISOString(),data},null,1)],{type:'application/json'});
    const a=document.createElement('a'),d=new Date(),p=x=>String(x).padStart(2,'0');
    a.href=URL.createObjectURL(blob);a.download='alibaba-terminal-yedek-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    msg.textContent=n+' ayar dosyaya yazıldı.';
  });
  $b('#bkUp').addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{
    const f=file.files&&file.files[0];pending=null;apply.hidden=true;if(!f)return;
    if(f.size>5e6){msg.textContent='Dosya çok büyük, yedek olamaz.';return}
    const r=new FileReader();
    r.onload=()=>{const p=bkParse(String(r.result||''));
      if(p.err){msg.textContent=p.err;return}
      pending=p;msg.textContent=p.n+' ayar bulundu'+(p.keys?' (API anahtarları dahil)':'')+'. Uygularsan bu tarayıcıdaki aynı ayarların üzerine yazılır, sayfa yenilenir.';apply.hidden=false};
    r.onerror=()=>{msg.textContent='Dosya okunamadı.'};
    r.readAsText(f);
  });
  apply.addEventListener('click',()=>{
    if(!pending)return;let bad=0;
    for(const [k,v] of Object.entries(pending.data)){try{localStorage.setItem(k,v)}catch{bad++}}
    msg.textContent=bad?bad+' ayar yazılamadı (depolama dolu olabilir).':'Yedek uygulandı, sayfa yenileniyor…';
    apply.hidden=true;if(!bad)setTimeout(()=>location.reload(),900);
  });
  $b('#bkDl').focus();
}

    {k:'ht',name:'Habertürk',q:['habertürk','haberturk'],re:/habert[uü]rk/i,c:'#d71920',logo:'https://yt3.ggpht.com/SqaSrx9HvlbnpXqfrsyqJOpL3uHHi3GQ3htT3gPdP3S8yebiy4iVPrZ4Ai1wQnNoHv7aUBLIeEE=s96-c-k-c0x00ffffff-no-rj'},
    /* NTV Radyo: dizindeki kayıtlar yalnızca http (https sayfada açılmaz), biri de .pls. Resmî https HLS yayını sabit verildi. */
    {k:'ntv',name:'NTV',q:[],re:/^$/,c:'#2f7fd1',logo:'https://yt3.ggpht.com/wwJNZ3QBI5ojqIlQvsInUIwIuSQH-lhQaqv_-WR7gYvEqa6WNEfpdiTls8z30QIxQMFbTBUQ0Q=s96-c-k-c0x00ffffff-no-rj',fix:'https://dygedge.radyotvonline.net/ntvradyo/playlist.m3u8'},
    {k:'odtu',name:'ODTÜ',q:['odtü','odtu'],re:/odt[uü]/i,c:'#ff9d1a',mono:'ODTÜ',logo:'https://tr.wikipedia.org/wiki/Special:FilePath/Orta_Do%C4%9Fu_Teknik_%C3%9Cniversitesi.png?width=96',fit:1}   /* ODTÜ'nün amblemi (Vikipedi): beyaz zeminli resim, yuvarlak etiketi dolduracak şekilde büyütülüp kırpılır; yüklenmezse baş harf rozeti */
  ];
  const norm=s=>({id:s.stationuuid,name:(s.name||'').trim().replace(/\s+/g,' '),url:s.url_resolved||s.url,alt:s.url,fav:s.favicon||'',br:s.bitrate||0,clk:s.clickcount||0});
  const up=u=>secure?String(u).replace(/^http:/i,'https:'):u;
  const good=s=>s.url&&s.name&&!/\.m3u8?(\?|$)/i.test(s.url);
  const search=async q=>{const p='/json/stations/search?name='+encodeURIComponent(q)+'&countrycode=TR&hidebroken=true&order=clickcount&reverse=true&limit=60';const j=await Promise.any(MIRRORS.map(m=>getJSON(m+p,8000)));return j.filter(s=>s.hls!==1).map(norm).filter(good)};
  let st0=LS.get('pano.radio.ch3',null);   /* {t, m:{k:{id,name,url,fav,br}}} */
  let map=st0&&Date.now()-st0.t<12*3600e3?st0.m:{},cur=null,state='idle',vol=+LS.get('pano.radio.vol',.7);if(!(vol>=0&&vol<=1))vol=.7;
  const fixed=c=>({id:'fix-'+c.k,name:c.name+' Radyo',url:c.fix,urls:[c.fix],fav:'',br:0});
  CH.forEach(c=>{if(c.fix)map[c.k]=fixed(c)});   /* sabit yayınlar önbellekteki eski kayıtların üstüne yazılır */
  const lastK=LS.get('pano.radio.last','');cur=CH.find(c=>c.k===lastK)||null;
  const audio=new Audio();audio.preload='none';audio.volume=vol;
  root.innerHTML='<div class="rd"><div class="rd-now"><div class="rd-disc" aria-hidden="true"></div><div class="rd-inf"><b class="rd-nm">Bir kanal seç</b><span class="rd-sl"><span class="rd-eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="rd-st">Hazır</span></span></div>'+
    '<button class="rd-sk rd-pv" type="button" aria-label="Önceki kanal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2v14H7zM20 5v14L10 12z"/></svg></button><button class="rd-pl" type="button" aria-label="Çal / durdur"></button><button class="rd-sk rd-nx" type="button" aria-label="Sonraki kanal"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 5h2v14h-2zM4 5v14l10-7z"/></svg></button></div>'+
    '<div class="rd-ctl"><div class="rd-list noscroll"></div>'+
    '<div class="rd-vol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg><input type="range" min="0" max="100" aria-label="Ses"></div>'+'</div></div>';
  let hls=null,gen=0;
  const killHls=()=>{gen++;if(hls){try{hls.destroy()}catch{}hls=null}};
  w._dispose=()=>{killHls();try{audio.pause();audio.removeAttribute('src');audio.load()}catch{}};
  const $r=s=>$(s,root),disc=$r('.rd-disc'),nm=$r('.rd-nm'),stt=$r('.rd-st'),pl=$r('.rd-pl'),lst=$r('.rd-list'),rng=$r('.rd-vol input'),box=$r('.rd');
  rng.value=Math.round(vol*100);
  const IC={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'};
  /* Kanal rozeti: altta baş harf, üstte logo (logo yüklenmezse kaldırılır, baş harf kalır) */
  const dot=c=>'<i class="rd-dot" style="--c:'+c.c+'"></i>';   /* kanal düğmelerinde renkli nokta; logo yalnızca plakta */
  const lg=(c,big)=>'<span class="rd-lg" style="--c:'+c.c+(c.fit?';background:#c8102e':'')+'">'+esc(big?(c.mono||c.name.slice(0,1)):c.name.slice(0,1))+(c.logo?'<img src="'+esc(c.logo)+'" alt="" referrerpolicy="no-referrer"'+(c.fit?' style="inset:auto;left:-5%;top:-3%;width:127%;height:106%;object-fit:fill"':'')+'>':'')+'</span>';
  root.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);
  function paintList(){
    lst.innerHTML=CH.map(c=>'<button type="button" class="rd-it'+(cur&&cur.k===c.k?' on':'')+(map[c.k]?'':' na')+'" data-k="'+c.k+'" title="'+esc(c.name)+'">'+dot(c)+'<span class="rd-n">'+esc(c.name)+'</span></button>').join('')+'';
  }
  function paintNow(){
    nm.textContent=cur?cur.name:'Bir kanal seç';
    const br=cur&&map[cur.k]&&+map[cur.k].br;
    const T={idle:cur?'Durdu':'Hazır',load:'<span class="rd-spin" aria-hidden="true"></span>Bağlanıyor…',play:'<span class="rd-badge"><i></i>CANLI</span>'+(br?'<span class="rd-br">'+br+' kbps</span>':''),err:'Bu yayın açılmadı',na:'Yayın adresi bulunamadı'};
    stt.innerHTML=T[state];stt.className='rd-st '+(state==='err'||state==='na'?'err':'');
    disc.innerHTML=cur?lg(cur,true):'<span class="rd-lg rd-lg0">♪</span>';
    pl.innerHTML=state==='play'||state==='load'?IC.pause:IC.play;
    box.classList.toggle('live',state==='play');
    root.querySelectorAll('.rd-it').forEach(b=>b.classList.toggle('on',!!cur&&b.dataset.k===cur.k));
    const on=lst.querySelector('.rd-it.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'nearest'})}catch{}
    if('mediaSession' in navigator&&cur){try{navigator.mediaSession.metadata=new MediaMetadata({title:cur.name,artist:'AliBaba Radyo'})}catch{}}
  }
  function play(c){
    cur=c;LS.set('pano.radio.last',c.k);
    const s=map[c.k];
    if(!s){state='na';audio.pause();paintNow();return}
    state='load';paintNow();
    tryIdx=0;start(s);
  }
  let tryIdx=0;
  function start(s){
    const list=s.urls&&s.urls.length?s.urls:[s.url];
    const u=list[tryIdx];
    killHls();audio.volume=vol;
    /* HLS (.m3u8): hls.js destekleniyorsa o çalar (canPlayType Chrome'da "maybe" deyip yine de açmıyor);
       MSE olmayan iPhone Safari'de yerel HLS kullanılır. */
    if(/\.m3u8(\?|$)/i.test(u)){
      const my=gen;
      loadHls().then(H=>{
        if(my!==gen)return;   /* bu arada durduruldu ya da başka kanal seçildi */
        if(H&&H.isSupported()){
          hls=new H({maxBufferLength:20});hls.loadSource(u);hls.attachMedia(audio);
          hls.on(H.Events.MANIFEST_PARSED,()=>{audio.play().catch(()=>fail())});
          hls.on(H.Events.ERROR,(_,d)=>{if(d.fatal)fail()});
        }else{audio.src=u;audio.play().catch(()=>fail())}
      }).catch(()=>{if(my===gen)fail()});
      return;
    }
    audio.src=u;
    audio.play().catch(()=>fail());
  }
  function fail(){
    const s=cur&&map[cur.k];if(!s)return;
    const list=s.urls&&s.urls.length?s.urls:[s.url];
    if(state==='load'&&tryIdx<list.length-1){tryIdx++;start(s);return}
    if(state==='load'||state==='play'){state='err';paintNow()}
  }
  audio.addEventListener('playing',()=>{state='play';paintNow()});
  audio.addEventListener('waiting',()=>{if(state==='play'){state='load';paintNow()}});
  audio.addEventListener('error',()=>{if(cur&&map[cur.k])fail()});
  audio.addEventListener('pause',()=>{if(state==='play'||state==='load'){state='idle';paintNow()}});
  pl.addEventListener('click',()=>{
    if(!cur){play(CH[0]);return}
    if(state==='play'||state==='load'){killHls();audio.pause();state='idle';paintNow()}else play(cur);
  });
  const step=d=>{const i=cur?CH.findIndex(c=>c.k===cur.k):-1;play(CH[(i+d+CH.length)%CH.length])};
  $r('.rd-pv').addEventListener('click',()=>step(-1));$r('.rd-nx').addEventListener('click',()=>step(1));
  rng.addEventListener('input',()=>{vol=rng.value/100;audio.volume=vol;LS.set('pano.radio.vol',vol)});
  lst.addEventListener('click',e=>{const b=e.target.closest('.rd-it');if(b)play(CH.find(c=>c.k===b.dataset.k))});
  async function resolve(){
    const qs=[...new Set(CH.flatMap(c=>c.q))],pool={};
    await Promise.allSettled(qs.map(async q=>{try{pool[q]=await search(q)}catch{pool[q]=[]}}));
    const m={};
    CH.forEach(c=>{
      if(c.fix){m[c.k]=fixed(c);return}
      const cand=[];c.q.forEach(q=>(pool[q]||[]).forEach(s=>{if(!cand.find(x=>x.id===s.id))cand.push(s)}));
      const hits=cand.filter(s=>c.re.test(s.name)&&!(c.not&&c.not.test(s.name))).sort((a,b)=>b.clk-a.clk).slice(0,4);
      if(hits.length){
        const urls=[];hits.forEach(h=>[h.url,h.alt].forEach(u=>{if(!u)return;const x=up(u);if(!urls.includes(x))urls.push(x)}));
        const hit=hits[0];m[c.k]={id:hit.id,name:hit.name,url:urls[0],urls,fav:hit.fav,br:hit.br};
      }
    });
    if(Object.keys(m).length){map=m;LS.set('pano.radio.ch3',{t:Date.now(),m});paintList();paintNow()}
  }
  paintList();paintNow();
  if(CH.some(c=>!map[c.k]))resolve();
}
const REG={   /* sıra = varsayılan yerleşim (ızgara soldan sağa, yukarıdan aşağıya doldurulur) */
 gnews:{title:'Son Dakika · Telegram',def:[3,3],mount:mountHaber},
 youtube:{title:'YouTube · Kick · Twitch · TV · Video · Bilgisayar',def:[6,4],mount:mountMedia},
 tech:{title:'Teknoloji · Oyun · Otomobil · Ekonomi',def:[3,3],mount:mountTechNews},
 prayer:{title:'Namaz Vakitleri',def:[3,1],mount:mountPrayer},

 daily:{title:'Ayet · Hadis · Esma',def:[3,1],mount:mountDaily},
 events:{title:'Vizyondaki Filmler',def:[3,2],mount:mountEvents},
 games:{title:'Oyunlar',def:[3,2],mount:mountGames},

if(!Array.isArray(layout))layout=defaultLayout();

layout=layout.filter(l=>REG[l.id]);
try{Object.keys(localStorage).filter(k=>k.startsWith('pano.fb.')||k.startsWith('pano.x.')).forEach(k=>localStorage.removeItem(k))}catch{}   /* kaldırılan Futbol ve X widget'larının eski kayıtları */
Object.keys(REG).forEach(id=>{if(!layout.find(l=>l.id===id))layout.push({id,w:REG[id].def[0],h:REG[id].def[1],hidden:id!=='controls'&&id!=='radio'})});
layout.forEach(l=>{if(l.id==='controls')l.hidden=false});
if(LS.get('pano.controls.size',0)!==1){const c=layout.find(l=>l.id==='controls');if(c){c.w=1;c.h=1}LS.set('pano.controls.size',1);LS.set('pano.layout.v3',layout)}   /* tek seferlik: Kontrol 1x1 olsun */   /* Düzenle düğmesi bu widget'ta: hiçbir zaman gizlenmez */
const saveLayout=()=>LS.set('pano.layout.v3',layout);
const items={};
let cols=12,gap=14,cellW=150,cellH=150;

/* Kontrol widget'ı 1 sütun olabilir; diğerleri en az 2. */
/* Tablet (6 sütun): grafik, hava ve oyun widget'ları en az 3 sütun × 2 satır olsun */
const TAB_MIN={radio:[3,2],tv:[3,2],weather:[3,2],games:[3,2]};
function effW(w,id){if(cols===4)return 4;const m=cols===6&&TAB_MIN[id]?TAB_MIN[id][0]:0;return Math.min(cols,Math.max(id==='controls'?1:2,w,m))}
/* Mobilde (4 sütun) hücreler küçük kalır; grafik, hava, namaz saatleri ve notlar için asgari yükseklik */
const MOB_MIN={radio:4,tv:4,weather:3,prayer:3,fx:3,notes:3,controls:2};
function effH(h,id){return cols===4?Math.max(h+1,MOB_MIN[id]||0):cols===6&&TAB_MIN[id]?Math.max(h,TAB_MIN[id][1]):h}
function applySize(el,l){el.style.gridColumn='span '+effW(l.w,l.id);el.style.gridRow='span '+effH(l.h,l.id);paintSizes(el,l)}
function paintSizes(el,l){$$('.w-sizes button',el).forEach(b=>{const p=PRESETS[b.dataset.s];b.classList.toggle('on',p[0]===l.w&&p[1]===l.h)})}
function metrics(){
  const W=grid.clientWidth;cols=W>=1000?12:W>=700?6:4;gap=W<520?10:14;
  const fit=cols===12;document.body.classList.toggle('fit',fit);
  const cw=(W-gap*(cols-1))/cols;let ch=cw;
  if(fit){
    const top=grid.getBoundingClientRect().top+scrollY;
    ch=Math.max(92,Math.min(260,(innerHeight-top-14-gap*5)/6));
    grid.style.setProperty('--cellh',ch+'px');
    const over=document.documentElement.scrollHeight-innerHeight;
    if(over>0&&over<=30)ch=Math.max(84,ch-Math.ceil(over/6));   /* yalnızca küçük taşmayı gider; ekran gerçekten kısaysa düzen (7) ile aynı kalır */
  }
  cellW=cw;cellH=ch;
  grid.style.setProperty('--cols',cols);grid.style.setProperty('--gap',gap+'px');grid.style.setProperty('--cell',cw+'px');grid.style.setProperty('--cellh',ch+'px');
  Object.values(items).forEach(el=>applySize(el,layout.find(l=>l.id===el.dataset.id)));
  syncTk();
}
/* Kayan şerit YouTube widget'ının tam üstüne hizalanır; soldaki kur/kripto çipleri kalan genişliğe sığacak kadar küçültülür.
   offsetLeft/offsetWidth kullanılır: fare eğimi (3B dönüş) ölçümü bozmaz. */
let tkRaf=0;
function syncTk(){
  const sb=$('#sb'),tk=$('#tk'),ch=$('#sbChips'),yt=items.youtube;
  if(!sb||!tk||!ch)return;
  const on=cols===12&&!!yt&&!yt.hidden&&!tk.hidden&&yt.offsetWidth>0;
  sb.classList.toggle('al',on);
  if(!on){tk.style.left='';tk.style.width='';ch.style.zoom='';return}
  const left=yt.offsetLeft-sb.offsetLeft-sb.clientLeft;
  tk.style.left=left+'px';tk.style.width=yt.offsetWidth+'px';
  ch.style.zoom='1';
  const padL=parseFloat(getComputedStyle(sb).paddingLeft)||14;
  const avail=left-padL-10,nat=ch.scrollWidth;
  ch.style.zoom=nat>0&&avail>0?Math.max(.6,Math.min(1.3,avail/nat)).toFixed(3):'1';
}
const syncTkSoon=()=>{if(tkRaf)return;tkRaf=requestAnimationFrame(()=>{tkRaf=0;syncTk()})};
function build(l,idx){
  const r=REG[l.id];
  const el=document.createElement('section');
  el.className='w';el.dataset.id=l.id;el.style.setProperty('--d',(-(idx*.07)%.3).toFixed(2)+'s');
  el.innerHTML='<div class="w-body"><div class="w-in"></div></div><button class="w-minus" type="button" aria-label="'+r.title+' widget\'ını kaldır">−</button><div class="w-sizes">'+Object.keys(PRESETS).map(k=>'<button type="button" data-s="'+k+'">'+k+'</button>').join('')+'</div><div class="w-resize" aria-hidden="true"></div><div class="w-grip" aria-hidden="true"></div><div class="w-shield"></div>';
  items[l.id]=el;
  return el;
}
function ensureMounted(el){
  if(el._m)return;el._m=1;el._gen=(el._gen||0)+1;
  REG[el.dataset.id].mount(el,$('.w-in',el));
}
/* Widget'ı tamamen kapat: medyayı durdur, zamanlayıcı/dinleyicileri geçersiz kıl, içeriği at.
   Yeniden eklenince ensureMounted sıfırdan kurar. */
function unmount(el){
  if(!el._m)return;
  el._m=0;el._gen=(el._gen||0)+1;
  if(el._dispose){try{el._dispose()}catch{}el._dispose=null}
  const old=$('.w-in',el);
  if(old){
    $$('iframe',old).forEach(f=>{try{f.src='about:blank'}catch{}});
    $$('video,audio',old).forEach(v=>{try{v.pause();v.removeAttribute('src');v.load()}catch{}});
    const fresh=document.createElement('div');fresh.className='w-in';
    old.replaceWith(fresh);   /* eski düğümle birlikte eski dinleyiciler de gider */
  }
}
function render(){
  grid.innerHTML='';
  layout.forEach((l,i)=>{const el=items[l.id]||build(l,i);el.hidden=!!l.hidden;grid.appendChild(el);if(l.hidden)unmount(el);else ensureMounted(el)});
  metrics();paintTray();
}

/* 3B eğim + ışık (fare ile) */
let tiltRaf=0,tiltEv=null;
grid.addEventListener('pointermove',e=>{
  if(document.body.classList.contains('editing')||e.pointerType!=='mouse'||document.documentElement.dataset.lite==='1')return;   /* Sade modda eğim yok */
  const el=e.target.closest('.w');if(!el)return;
  if(el.dataset.id==='youtube'){tiltEv=null;const s=el.style;s.setProperty('--rx','0deg');s.setProperty('--ry','0deg');s.setProperty('--glare',0);return}   /* YouTube · Kick · Twitch · TV · Video · Bilgisayar widget'ı hiçbir sekmede fareyle eğilmesin */
  tiltEv={el,cx:e.clientX,cy:e.clientY};
  if(tiltRaf)return;
  tiltRaf=requestAnimationFrame(()=>{
    tiltRaf=0;const t=tiltEv;if(!t||!t.el.isConnected)return;
    const r=t.el.getBoundingClientRect(),x=(t.cx-r.left)/r.width,y=(t.cy-r.top)/r.height;
    const st=t.el.style;
    st.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg');st.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');
    st.setProperty('--mx',(x*100)+'%');st.setProperty('--my',(y*100)+'%');st.setProperty('--glare',1);
  });
});
grid.addEventListener('pointerout',e=>{const el=e.target.closest&&e.target.closest('.w');if(el&&!el.contains(e.relatedTarget)){tiltEv=null;el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');el.style.setProperty('--glare',0)}});

/* uzun basınca düzenleme */
let lp=null;
grid.addEventListener('pointerdown',e=>{
  if(body.classList.contains('editing'))return;
  if(e.button||e.target.closest('input,textarea,button,a,iframe,.yt-view'))return;   /* sağ/orta tık düzenlemeyi açmaz */
  const x=e.clientX,y=e.clientY;
  lp=setTimeout(()=>edit(true),650);
  const cancel=ev=>{if(ev.type==='pointerup'||ev.type==='pointercancel'||Math.hypot(ev.clientX-x,ev.clientY-y)>10){clearTimeout(lp);window.removeEventListener('pointermove',cancel);window.removeEventListener('pointerup',cancel);window.removeEventListener('pointercancel',cancel)}};
  window.addEventListener('pointermove',cancel);window.addEventListener('pointerup',cancel);window.addEventListener('pointercancel',cancel);
});
/* Sürükle-bırak sıralama */
function flip(fn,skip){
  const els=[...grid.children].filter(c=>c!==skip&&!c.hidden);
  const before=new Map(els.map(c=>[c,c.getBoundingClientRect()]));
  fn();
  els.forEach(c=>{const a=before.get(c),b=c.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy)c.animate({translate:[dx+'px '+dy+'px','0px 0px']},{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'})});
}
/* Not: widget DOM'da yer değiştirince tarayıcı işaretçi yakalamasını bırakır.
   Bu yüzden hareket ve bırakma olayları pencereden dinlenir. */
grid.addEventListener('pointerdown',e=>{
  if(!body.classList.contains('editing'))return;
  const grip=e.target.closest('.w-grip'),sh=e.target.closest('.w-shield');
  if(!grip&&!sh)return;
  if(sh&&!grip&&e.pointerType==='touch')return;   /* dokunmatikte sayfa kaydırılabilsin; sürükleme tutamaçtan */
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  const el=(grip||sh).closest('.w'),pid=e.pointerId;
  const r0=el.getBoundingClientRect(),gx=e.clientX-r0.left,gy=e.clientY-r0.top;
  let swapped=null,cool=0,lx=e.clientX,ly=e.clientY;
  el.classList.add('dragging');body.classList.add('is-dragging');
  const place=()=>{
    el.style.translate='0px 0px';const b=el.getBoundingClientRect();
    el.style.translate=(lx-gx-b.left)+'px '+(ly-gy-b.top)+'px';
    return b;
  };
  const mv=ev=>{
    if(ev.pointerId!==pid)return;
    lx=ev.clientX;ly=ev.clientY;
    if(ly<80)scrollBy(0,-18);else if(ly>innerHeight-80)scrollBy(0,18);
    const b=place();
    if(lx>b.left&&lx<b.right&&ly>b.top&&ly<b.bottom){swapped=null;return}
    if(performance.now()<cool)return;
    const over=[...grid.children].find(c=>{if(c===el||c.hidden)return false;const r=c.getBoundingClientRect();return lx>r.left&&lx<r.right&&ly>r.top&&ly<r.bottom});
    if(!over||over===swapped)return;
    swapped=over;
    const after=!!(el.compareDocumentPosition(over)&Node.DOCUMENT_POSITION_FOLLOWING);
    flip(()=>grid.insertBefore(el,after?over.nextSibling:over),el);
    place();cool=performance.now()+220;
  };
  const up=ev=>{
    if(ev&&ev.pointerId!==pid)return;
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    const from=el.style.translate||'0px 0px';
    el.classList.remove('dragging');body.classList.remove('is-dragging');
    el.animate({translate:[from,'0px 0px']},{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});el.style.translate='';
    layout=[...grid.children].map(c=>layout.find(l=>l.id===c.dataset.id)).filter(Boolean);saveLayout();syncTkSoon();
  };
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});
/* Yeniden boyutlandırma */
grid.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.w-resize');if(!h||!body.classList.contains('editing'))return;
  e.preventDefault();e.stopPropagation();
  const el=h.parentElement,l=layout.find(x=>x.id===el.dataset.id),pid=e.pointerId;
  const step=cellW+gap,stepY=cellH+gap;
  const sx=e.clientX,sy=e.clientY,w0=effW(l.w,l.id),h0=effH(l.h,l.id);
  body.classList.add('is-dragging');
  const mv=ev=>{
    if(ev.pointerId!==pid)return;
    const nw=Math.max(l.id==='controls'?1:2,Math.min(cols,w0+Math.round((ev.clientX-sx)/step)));
    const nh=Math.max(1,Math.min(10,h0+Math.round((ev.clientY-sy)/stepY)));
    if(cols!==4)l.w=nw;
    l.h=cols===4?Math.max(1,nh-1):nh;applySize(el,l);
  };
  const up=ev=>{
    if(ev&&ev.pointerId!==pid)return;
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    body.classList.remove('is-dragging');saveLayout();syncTkSoon();
  };
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
});
let mRaf=0;
const metricsSoon=()=>{if(mRaf)return;mRaf=requestAnimationFrame(()=>{mRaf=0;metrics()})};
new ResizeObserver(metricsSoon).observe(grid);
addEventListener('resize',metricsSoon);addEventListener('load',metricsSoon);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(metricsSoon);
['.top','#sb','#tk'].forEach(q=>{const n=document.querySelector(q);if(n)new ResizeObserver(metricsSoon).observe(n)});

/* ---------- Üst bölüm ---------- */
/* Uykudan / arka plandan dönüş, bağlantı geri gelmesi: tüm widget'lara "refresh" gönder.
   Gece 04:00'te sayfayı bir kez yenile (iframe ve bellek birikmesini temizler). */
let lastTick=Date.now(),hiddenAt=0,lastRefresh=0;
const refreshAll=()=>{if(Date.now()-lastRefresh<5e3)return;lastRefresh=Date.now();bus.dispatchEvent(new Event('refresh'))};
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>60e3)refreshAll()});
addEventListener('online',refreshAll);
function nightReload(n){
  if(n.getHours()!==4||n.getMinutes()!==0||performance.now()<3600e3)return;
  const a=document.activeElement;
  if(document.body.classList.contains('editing')||(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)))return;
  if([...document.querySelectorAll('video')].some(v=>!v.paused&&!v.ended))return;
  location.reload();
}
function tick(){
  const n=new Date(),h=n.getHours();
  if(n-lastTick>30e3)refreshAll();   /* sistem uykudan döndü */
  lastTick=+n;nightReload(n);
  $('#clock').textContent=n.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  const dl=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(dl!==tick.d){tick.d=dl;$('#dateLine').textContent=dl}
}
/* "Terminal" yazısı "AliBaba" ile aynı genişlikte olsun: yazı boyutunu ona göre ayarla. */
(function(){
  const n=$('.brand-n'),t=$('.brand-t');if(!n||!t)return;
  const fit=()=>{
    t.style.fontSize='40px';
    const tw=t.getBoundingClientRect().width-.14*40,nw=n.getBoundingClientRect().width;
    if(tw>0&&nw>0)t.style.fontSize=Math.max(10,Math.min(60,40*nw/tw)).toFixed(2)+'px';
  };
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(n);else addEventListener('resize',fit);
})();
tick();setInterval(tick,1000);

/* Şehir seçici */
const pop=$('#cityPop'),cin=$('#cityIn'),cmsg=$('#cityMsg');
const fillPop=()=>{
  $('#popName').textContent=place.name;
  $('#popCoord').textContent=Math.abs(place.lat).toFixed(2)+'° '+(place.lat>=0?'Kuzey':'Güney')+'  ·  '+Math.abs(place.lon).toFixed(2)+'° '+(place.lon>=0?'Doğu':'Batı');
};
$('#sbR').addEventListener('click',e=>{
  if(!e.target.closest('#sbWx'))return;
  e.stopPropagation();pop.hidden=!pop.hidden;
  if(!pop.hidden){fillPop();cmsg.textContent='';cin.value='';cin.focus()}
});
pop.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>{pop.hidden=true});
const search=async()=>{
  const q=cin.value.trim();if(!q)return;cmsg.textContent='Aranıyor…';
  try{setPlace(await geocode(q));fillPop();pop.hidden=true}catch{cmsg.textContent='Şehir bulunamadı. Farklı yazmayı dene.'}
};
$('#cityGo').addEventListener('click',search);
cin.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('#geoBtn').addEventListener('click',()=>{
  if(!navigator.geolocation){cmsg.textContent='Bu tarayıcı konumu desteklemiyor.';return}
  cmsg.textContent='Konum alınıyor…';
  navigator.geolocation.getCurrentPosition(async p=>{
    let name='Konumum';
    try{const j=await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&localityLanguage=tr');name=j.city||j.locality||name}catch{}
    setPlace({name,lat:p.coords.latitude,lon:p.coords.longitude});pop.hidden=true;
  },()=>{cmsg.textContent='Konum izni verilmedi. Şehir adını yazabilirsin.'},{timeout:9000});
});

/* Tema */
function setTheme(t){
  dark=t==='dark';document.documentElement.dataset.theme=t;LS.set('pano.theme',t);
  document.querySelector('meta[name=theme-color]').content=dark?'#070817':'#e8ecfa';
  if(window.__bgTheme)window.__bgTheme(dark);
}
document.addEventListener('click',e=>{if(e.target.closest('#themeBtn'))setTheme(dark?'light':'dark')});
function setLite(on){
  document.documentElement.dataset.lite=on?'1':'0';LS.set('pano.lite',!!on);
  const b=$('#liteBtn');if(b){b.classList.toggle('on',!!on);b.setAttribute('aria-pressed',on?'true':'false')}
  dispatchEvent(new Event('panolite'));
}
document.addEventListener('click',e=>{if(e.target.closest('#liteBtn'))setLite(document.documentElement.dataset.lite!=='1')});
setLite(!!LS.get('pano.lite',false));
setTheme(LS.get('pano.theme',null)||'dark');   /* varsayılan: koyu tema */

render();startTicker();startNewsTicker();

/* ---------- Three.js arka plan ---------- */
(function bg(){
  const T=window.THREE;if(!T){window.__bgTheme=d=>{document.body.style.background=d?'radial-gradient(circle at 20% 10%,#3b2a8f,#070817 60%)':'radial-gradient(circle at 20% 10%,#cdc3ff,#e8ecfa 60%)'};window.__bgTheme(document.documentElement.dataset.theme!=='light');return}
  const canvas=$('#bg');
  let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true})}catch{return}
  renderer.setPixelRatio(matchMedia('(pointer:coarse)').matches?1:Math.min(devicePixelRatio||1,1.5));
  renderer.autoClear=false;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bgScene=new T.Scene(),bgCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
  const C=(h)=>new T.Color(h);
  const pal={dark:{c0:C('#070817'),c1:C('#3b2a8f'),c2:C('#0b5fa8'),c3:C('#a82a63')},light:{c0:C('#eaeefb'),c1:C('#bcaaff'),c2:C('#9ad4ff'),c3:C('#ffb6d0')}};
  const U={t:{value:0},res:{value:new T.Vector2(1,1)},m:{value:new T.Vector2(0,0)},c0:{value:pal.dark.c0.clone()},c1:{value:pal.dark.c1.clone()},c2:{value:pal.dark.c2.clone()},c3:{value:pal.dark.c3.clone()}};
  const mat=new T.ShaderMaterial({uniforms:U,vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:'precision highp float;varying vec2 vUv;uniform float t;uniform vec2 res;uniform vec2 m;uniform vec3 c0,c1,c2,c3;'+
    'float bl(vec2 p,vec2 c,float r){return smoothstep(r,0.,length(p-c));}'+
    'void main(){float a=res.x/res.y;vec2 p=vec2(vUv.x*a,vUv.y);float s=t*.09;vec3 col=c0;'+
    'col=mix(col,c1,bl(p,vec2((.28+.18*sin(s*1.3+m.x))*a,.72+.14*cos(s)),.8));'+
    'col=mix(col,c2,bl(p,vec2((.78+.16*cos(s*.9))*a,.34+.18*sin(s*1.1+m.y)),.85));'+
    'col=mix(col,c3,bl(p,vec2((.5+.25*sin(s*.7+2.))*a,.08+.12*cos(s*1.4)),.7));'+
    'col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)*.018;gl_FragColor=vec4(col,1.);}'});
  const quad=new T.Mesh(new T.PlaneGeometry(2,2),mat);quad.frustumCulled=false;bgScene.add(quad);

  const scene=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,100);cam.position.set(0,0,10);cam.lookAt(0,0,0);
  scene.add(new T.AmbientLight(0xffffff,.65));
  const key=new T.DirectionalLight(0xffffff,1.1);key.position.set(3,5,6);scene.add(key);
  const p1=new T.PointLight(0xff5fa2,1.4,40);p1.position.set(-6,2,4);scene.add(p1);
  const p2=new T.PointLight(0x5fd0ff,1.4,40);p2.position.set(6,-3,4);scene.add(p2);
  const geos=[new T.IcosahedronGeometry(1,0),new T.TorusGeometry(.8,.32,20,48),new T.OctahedronGeometry(1,0),new T.SphereGeometry(.9,32,24),new T.TorusKnotGeometry(.62,.2,96,12),new T.DodecahedronGeometry(.95,0)];
  const cols3=[0x8f7bff,0x4cc9f0,0xff7ab8,0xffd36e,0x6ee7b7,0xa78bfa];
  const N=14,STEP=3.6,objs=[];
  for(let i=0;i<N;i++){
    const m=new T.Mesh(geos[i%geos.length],new T.MeshStandardMaterial({color:cols3[i%cols3.length],metalness:.2,roughness:.22,transparent:true,opacity:.78}));
    m.userData={side:i%2?1:-1,ox:Math.random(),sp:.15+Math.random()*.3,ph:Math.random()*6.28};
    m.position.y=0;m.position.z=-1-Math.random()*5;m.scale.setScalar(.9+Math.random()*.9);
    scene.add(m);objs.push(m);
  }
  let W=1,H=1,aspect=1;
  const size=()=>{W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);aspect=W/H;cam.aspect=aspect;cam.updateProjectionMatrix();U.res.value.set(W,H);
    const vw=2*10*Math.tan(22.5*Math.PI/180)*aspect;
    const vh=2*10*Math.tan(22.5*Math.PI/180);
    objs.forEach((o,i)=>{o.position.x=o.userData.side*(vw*.5*(.45+o.userData.ox*.6));o.userData.by=(((i*.618)%1)-.5)*vh*.95});};
  size();addEventListener('resize',size);
  const target={...pal.dark};const cur={c0:U.c0.value,c1:U.c1.value,c2:U.c2.value,c3:U.c3.value};
  window.__bgTheme=d=>{const p=d?pal.dark:pal.light;target.c0=p.c0;target.c1=p.c1;target.c2=p.c2;target.c3=p.c3;
    objs.forEach(o=>{o.material.opacity=d?.78:.6})};
  const p0=document.documentElement.dataset.theme==='light'?pal.light:pal.dark;
  Object.keys(cur).forEach(k=>{cur[k].copy(p0[k]);target[k]=p0[k]});
  /* Döngü: ekranın yenileme hızında (60 kare/sn) çalışır. Sekme gizliyken, düzenleme/sürükleme sırasında ve "Sade" modda durur.
     Tema değişimi ve yeniden boyutlandırma için kısa süreli "boost" kareleri çizilir. */
  const MIN=matchMedia('(pointer:coarse)').matches?1000/30:0;   /* dokunmatikte 30 kare/sn (pil ve ısı); masaüstünde ekran hızı */
  let last=performance.now(),t=0,raf=0,boost=3;
  const isLite=()=>document.documentElement.dataset.lite==='1';
  const busy=()=>document.hidden||document.body.classList.contains('editing')||document.body.classList.contains('is-dragging');
  function step(dt){
    t+=dt*(reduce?.15:1);U.t.value=t;
    Object.keys(cur).forEach(k=>cur[k].lerp(target[k],.1));
    objs.forEach(o=>{const u=o.userData;o.rotation.x+=dt*u.sp;o.rotation.y+=dt*u.sp*1.3;o.position.y=u.by+Math.sin(t*.5+u.ph)*(reduce?.05:.3)});
    renderer.clear();renderer.render(bgScene,bgCam);renderer.clearDepth();renderer.render(scene,cam);
  }
  function loop(now){
    raf=0;
    if(document.hidden)return;
    if(boost>0)boost--;
    else if(isLite()||busy()){last=now;return}
    if(now-last>=MIN){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt)}
    raf=requestAnimationFrame(loop);
  }
  function wake(n){if(n&&n>boost)boost=n;if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(loop)}}
  document.addEventListener('visibilitychange',()=>wake(2));
  new MutationObserver(()=>wake(2)).observe(document.body,{attributes:true,attributeFilter:['class']});
  addEventListener('panolite',()=>wake(40));
  const prevTheme=window.__bgTheme;
  window.__bgTheme=d=>{prevTheme(d);wake(45)};
  addEventListener('resize',()=>wake(3));
  wake(3);
})();
})();
</script>
